<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Karten & Auszeichnungen · Takeover League</title>
<style>:root{color-scheme:dark;font:16px system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;padding:var(--sp-5) var(--sp-4) 110px;background:var(--bg);color:var(--text)}main{max-width:820px;margin:auto}h1{color:var(--gold)}a{color:var(--gold)}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}</style>
<link rel="stylesheet" href="./takeover-navigation.css"><link rel="stylesheet" href="./takeover-theme.css"><link rel="stylesheet" href="./takeover-redesign.css"></head><body data-tl-screen="karten">
<main><div class="tl-screen-ribbon" aria-label="Aktueller Bereich: Karten & Auszeichnungen"><div class="tl-screen-identity"><span class="tl-screen-symbol" aria-hidden="true">🎴</span><div><div class="tl-screen-eyebrow">TAKEOVER LEAGUE · Spielerkarte gestalten</div><div class="tl-screen-title">Karten & Auszeichnungen</div></div></div><div class="tl-screen-links"><a href="./karten.html" class="tl-screen-primary">Karten</a><a href="./bewertung.html">Bewertung</a><a href="./boxer.html">Mein Studio</a></div></div>
<p class="tl-subnav"><a href="./boxer.html">← Mein Studio</a></p>
<h1 id="pageTitle">Karten & Auszeichnungen</h1>
<p id="status" class="tlp-status" role="status" aria-live="polite">Wird geladen …</p>
<div id="app"></div>
</main>
<script src="./takeover-performance.js" defer></script>
<script type="module">
const P=window.TLPerf,$=id=>document.getElementById(id),app=$('app'),status=$('status');
const say=(t,err)=>{status.textContent=t;status.classList.toggle('error',!!err);status.hidden=!t};
const RANKS=['F','E','D','C','B','A','S'];
let db,mine=null,awards=null,staff=null,perf=null,view='designs',busy=false,pd=null,pdList=null;
const fmtP=(k,a,b)=>k==='cotw'?P.fmtDate(a)+' – '+P.fmtDate(b):k==='cotm'?new Intl.DateTimeFormat('de-CH',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(a+'T12:00:00Z')):String(a).slice(0,4);
function previewCard(look,w){
 // Etappe 15: so, wie andere die Karte sehen (öffentliche Werte).
 const raw=perf&&perf.rating&&perf.rating.current?perf.rating.current.summary:null,r=raw?(P.pubOf(raw)||raw):null;
 const pos=perf&&perf.style&&perf.style.current?P.styleType(perf.style.current.scores).pos:'BOX';
 return P.card({name:mine.display_name,overall:r?r.overall:70,categories:r?r.categories:{OFF:70,DEF:70,BEI:70,KON:70,TAK:70,MEN:70},pos,width:w||120,look});
}
function lockText(d){
 if(d.available)return '';
 if(d.unlock==='rank')return 'ab Rang '+d.min_rank+' (du: '+mine.rank+')';
 if(d.unlock==='shop')return d.price+' Coins';
 if(d.unlock==='award')return d.won?'abgelaufen – gilt wieder nach der nächsten '+P.AWARD_LABEL[d.award_kind]:'nur als '+P.AWARD_LABEL[d.award_kind];
 return 'gesperrt';
}
// Etappe 13: Auszeichnungs-Designs gelten nur im Zeitraum nach dem Gewinn – «gilt bis» zeigen.
const untilText=d=>d&&d.unlock==='award'&&d.valid_until?'gilt bis '+P.fmtDate(d.valid_until):'';
function designsView(){
 const cur=mine.look.key,curD=mine.designs.find(d=>d.key===cur);
 const groups=[['start','Standard'],['rank','Mit dem Rang freigeschaltet'],['shop','Im Shop (Kampfgeist-Coins)'],['award','Nur als Auszeichnung']]; // «Eigenes Design» hat einen eigenen Bereich
 return `<div class="tlp-panel tlp-row"><div>${previewCard(mine.look,170)}</div><div><div class="tlp-eyebrow">Aktuelles Design</div><div class="tlp-big">${P.esc(mine.look.name)}</div>${untilText(curD)?`<span class="kd-until">${P.esc(untilText(curD))}</span>`:''}
   <p class="tlp-note">Rang ${P.esc(mine.rank)}${mine.shop?' · '+(mine.coins??0)+' Coins':''}. Andere Mitglieder sehen deine Karte in diesem Design.</p></div></div>
  ${ownView()}
  ${groups.map(([u,l])=>{const ds=mine.designs.filter(d=>d.unlock===u);if(!ds.length)return '';
   return `<h2>${P.esc(l)}</h2><div class="kd-grid">${ds.map(d=>`<article class="kd-item${d.available?'':' locked'}${d.key===cur?' on':''}">
    ${previewCard({key:d.key,name:d.name,design:d.design,awards:[]},110)}
    <b>${P.esc(d.name)}</b><span class="tlp-note">${P.esc(d.description||'')}</span>${untilText(d)?`<span class="kd-until">${P.esc(untilText(d))}</span>`:''}
    ${d.key===cur?'<span class="kd-state">✓ ausgewählt</span>':d.available?`<button type="button" class="tlp-btn" data-equip="${P.esc(d.key)}">Auswählen</button>`
     :d.unlock==='shop'&&mine.shop?`<button type="button" class="tlp-btn ghost" data-buy="${P.esc(d.key)}" ${(mine.coins??0)<d.price?'disabled':''}>Kaufen · ${d.price} Coins</button>`
     :`<span class="kd-state">🔒 ${P.esc(lockText(d))}</span>`}</article>`).join('')}</div>`}).join('')}`;
}
// Etappe 12: eigenes Design – Name, vier Farben, Muster, Abzeichen, Leuchten; Vorschau live, der Server prüft beim Speichern.
const PATTERN_LABEL={carbon:'Carbon',waves:'Wellen',sparks:'Funken',aurora:'Polarlicht',crown:'Gitter',rays:'Strahlen',grid:'Raster',petals:'Blüten',bolts:'Blitze',diamond:'Rauten',
 stripes:'Streifen',stars:'Sterne',halftone:'Comic-Raster',dots:'Punkte',marble:'Marmor',camo:'Tarnmuster',hex:'Waben',circuit:'Leiterbahnen',tiger:'Tiger',flames:'Flammen'};
const hexOk=v=>/^#[0-9a-f]{6}$/i.test(String(v||''));
function ownDesignFromForm(f){
 const v=n=>f.elements.namedItem(n);
 const d={a:v('a').value,b:v('b').value,ink:v('ink').value,edge:v('edge').value,pattern:v('pattern').value};
 const badge=(v('badge').value||'').trim().toUpperCase();if(badge)d.badge=badge;if(v('glow').checked)d.glow=true;
 return d;
}
function ownView(){
 if(!pd||!pd.granted)return '';
 const d=pd.design||{},col=(k,l)=>`<label>${l}<input type="color" name="${k}" value="${hexOk(d[k])?P.esc(String(d[k]).toLowerCase()):'#888888'}"></label>`;
 return `<section class="tlp-panel kd-own" aria-label="Mein eigenes Design"><h2>Mein eigenes Design</h2>
  <div class="kd-own-row"><div class="kd-own-preview">${previewCard({key:'eigen',name:pd.name,design:d,awards:[]},150)}</div>
  <form class="kd-own-form" novalidate>
   <label class="tlp-field">Name des Designs<input name="dname" maxlength="24" required value="${P.esc(pd.name||'')}"></label>
   <div class="kd-colors">${col('a','Oben')}${col('b','Unten')}${col('ink','Schrift')}${col('edge','Rand')}</div>
   <label class="tlp-field">Muster<select name="pattern">${(pd.patterns||[]).map(x=>`<option value="${P.esc(x)}" ${x===d.pattern?'selected':''}>${P.esc(PATTERN_LABEL[x]||x)}</option>`).join('')}</select></label>
   <label class="tlp-field">Abzeichen oben <span class="tlp-note">optional, 3–5 Buchstaben A–Z</span><input name="badge" maxlength="5" autocapitalize="characters" value="${P.esc(d.badge||'')}"></label>
   <label class="kd-check"><input type="checkbox" name="glow" ${d.glow?'checked':''}> Karte leuchtet</label>
   <button type="submit" class="tlp-btn">Design speichern</button>
  </form></div>
  ${pd.equipped?'<span class="kd-state">✓ Deine Karte zeigt dieses Design</span>':'<button type="button" class="tlp-btn ghost" data-equip="eigen">Als meine Karte auswählen</button>'}
  <p class="tlp-note">Andere sehen deine Karte genau so. Die Vorschau zeigt Änderungen sofort, gespeichert wird erst mit «Design speichern».</p></section>`;
}
function pdAdminView(){
 if(!perf||!perf.profile||perf.profile.role!=='admin')return '';
 if(!pdList)return '<section class="tlp-panel"><h2>Eigenes Design</h2><p class="tlp-note">Wird geladen …</p></section>';
 return `<section class="tlp-panel" aria-label="Eigenes Design freischalten"><h2>Eigenes Design</h2><p class="tlp-note">Wer freigeschaltet ist, gestaltet seine Karte unter «Meine Designs» selbst. Entziehen behält die Gestaltung.</p>
  <ul class="kd-pd-list">${pdList.map(x=>`<li><span><b>${P.esc(x.display_name)}</b>${x.active?` <span class="kd-state">✓ freigeschaltet${x.name?' · '+P.esc(x.name):''}</span>`:''}</span>
   <button type="button" class="tlp-btn ${x.active?'ghost':''} small" data-pd="${P.esc(x.profile_id)}" data-on="${x.active?'0':'1'}">${x.active?'Entziehen':'Freischalten'}</button></li>`).join('')}</ul></section>`;
}
function awardsView(){
 if(!awards||!awards.enabled)return '<div class="tlp-panel"><p class="tlp-note">Noch keine Auszeichnungen.</p></div>';
 const latest=['cotw','cotm','poty'].map(k=>[k,awards.latest&&awards.latest[k]]);
 return `<div class="kd-awards">${latest.map(([k,a])=>`<article class="tlp-panel kd-award"><div class="tlp-eyebrow">${P.esc(P.AWARD_LABEL[k])}</div>
   ${a?`<b>${P.esc(a.display_name)}</b><span class="tlp-note">${P.esc(fmtP(k,a.period_start,a.period_end))} · ${a.exp} EXP</span>${a.design_until?`<span class="kd-until">Spezial-Design bis ${P.esc(P.fmtDate(a.design_until))}</span>`:''}${a.note?`<p class="tlp-quote">«${P.esc(a.note)}»</p>`:''}`:'<span class="tlp-note">Noch nicht vergeben.</span>'}</article>`).join('')}</div>
  <h2>Verlauf</h2>${(awards.history||[]).length?`<div class="tlp-panel"><ul class="kd-hist">${awards.history.map(a=>`<li><span>${a.kind==='poty'?'👑':a.kind==='cotm'?'🏆':'⭐'} <b>${P.esc(a.display_name)}</b> · ${P.esc(P.AWARD_LABEL[a.kind])}</span><span class="tlp-note">${P.esc(fmtP(a.kind,a.period_start,a.period_end))}</span></li>`).join('')}</ul></div>`:'<p class="tlp-note">Noch keine Auszeichnungen vergeben.</p>'}
  <p class="tlp-note">Wer die meisten EXP aus bestätigten Trainings sammelt, wird vorgeschlagen. Ein Trainer bestätigt die Auszeichnung. Das Spezial-Design gilt im Zeitraum danach: nach der Card of the Week die ganze nächste Woche, nach der Card of the Month den nächsten Monat, nach dem Player of the Year das nächste Jahr. Die Symbole ⭐ 🏆 👑 auf deiner Karte bleiben für immer.</p>`;
}
// Etappe 14: «Diesmal nicht vergeben» (aufhebbar) und alle kürzlich vergebenen Auszeichnungen zurückziehen.
const revokeForm=a=>`<details class="kd-more"><summary>Zurückziehen</summary><form class="kd-revoke" data-id="${a.id}"><label class="tlp-field">Grund<input name="reason" maxlength="300" required placeholder="z. B. falsche Woche"></label><button type="submit" class="tlp-btn ghost">Zurückziehen</button><p class="tlp-note">Spezial-Design und Symbol verschwinden sofort.</p></form></details>`;
const skipView=s=>`<p>✕ <b>Nicht vergeben</b> · von ${P.esc(s.skipped_by||'')}${s.note?' · «'+P.esc(s.note)+'»':''}</p>${s.can_undo?`<button type="button" class="tlp-btn ghost" data-unskip="${s.id}">Doch vergeben</button>`:''}`;
const skipForm=(k,p)=>`<details class="kd-more"><summary>Diesmal nicht vergeben</summary><form class="kd-skip" data-kind="${k}" data-start="${p.start}"><label class="tlp-field">Grund (optional)<input name="note" maxlength="300" placeholder="z. B. Ferienwoche, zu wenige Trainings"></label><button type="submit" class="tlp-btn ghost">Nicht vergeben</button></form></details>`;
function recentView(){
 const shown=new Set(staff.kinds.flatMap(k=>k.periods.map(p=>p.award&&p.award.id)).filter(Boolean));
 const list=(staff.recent||[]).filter(a=>!shown.has(a.id));
 const skips=(staff.skips||[]).filter(s=>!staff.kinds.some(k=>k.periods.some(p=>p.skip&&p.skip.id===s.id)));
 if(!list.length&&!skips.length)return '';
 return `<section class="tlp-panel"><h2>Frühere Zeiträume</h2><ul class="kd-hist">${list.map(a=>`<li><span>${a.kind==='poty'?'👑':a.kind==='cotm'?'🏆':'⭐'} <b>${P.esc(a.display_name)}</b> · ${P.esc(P.AWARD_LABEL[a.kind])} · ${P.esc(fmtP(a.kind,a.period_start,a.period_end))}</span>${a.can_revoke?revokeForm(a):`<span class="tlp-note">vergeben von ${P.esc(a.awarded_by||'')}</span>`}</li>`).join('')}
  ${skips.map(x=>`<li><span>✕ ${P.esc(P.AWARD_LABEL[x.kind])} · ${P.esc(fmtP(x.kind,x.period_start,x.period_end))} · nicht vergeben${x.note?' · «'+P.esc(x.note)+'»':''}</span>${x.can_undo?`<button type="button" class="tlp-btn ghost" data-unskip="${x.id}">Doch vergeben</button>`:''}</li>`).join('')}</ul></section>`;
}
function staffView(){
 if(!staff)return pdAdminView()+'<p class="tlp-note">Wird geladen …</p>';
 return pdAdminView()+staff.kinds.map(k=>`<section class="tlp-panel"><h2>${P.esc(P.AWARD_LABEL[k.kind])}</h2>${k.periods.map(p=>`<div class="kd-period"><div class="tlp-row spread"><b>${P.esc(fmtP(k.kind,p.start,p.end))}</b><span class="tlp-note">${p.completed?'abgeschlossen':'läuft noch'}</span></div>
   ${p.award?`<p>✓ <b>${P.esc(p.award.display_name)}</b> · vergeben von ${P.esc(p.award.awarded_by||'')}${p.award.note?' · «'+P.esc(p.award.note)+'»':''} </p>${revokeForm(p.award)}`
    :p.skip?skipView(p.skip)
    :`<ol class="kd-cands">${p.candidates.map((c,i)=>`<li><b>${P.esc(c.display_name)}</b> · ${c.exp} EXP · ${c.trainings} Trainings${i===0?' <span class="kd-state">Vorschlag</span>':''}</li>`).join('')||'<li class="tlp-note">Noch keine bestätigten Trainings.</li>'}</ol>
     ${p.completed?`<form class="kd-confirm" data-kind="${k.kind}" data-start="${p.start}"><label class="tlp-field">Boxer<select name="who">${staff.boxers.map(b=>`<option value="${P.esc(b.id)}" ${p.candidates[0]&&p.candidates[0].profile_id===b.id?'selected':''}>${P.esc(b.display_name)}</option>`).join('')}</select></label>
      <label class="tlp-field">Begründung (optional)<input name="note" maxlength="300" placeholder="z. B. drei starke Pflichttrainings"></label><button type="submit" class="tlp-btn">Auszeichnen</button>${(k.periods.find(x=>!x.completed)||{}).end?`<p class="tlp-note">Spezial-Design für den Gewinner bis ${P.esc(P.fmtDate(k.periods.find(x=>!x.completed).end))}.</p>`:''}</form>${skipForm(k.kind,p)}`
     :'<p class="tlp-note">Vergeben kannst du nach Ende des Zeitraums.</p>'}`}</div>`).join('')}</section>`).join('')+recentView();
}
function tabs(){
 const t=[['designs','Meine Designs'],['awards','Auszeichnungen']];if(mine.staff)t.push(['staff','Vergeben']);
 return `<div class="fb-tabs" role="tablist">${t.map(([k,l])=>`<button type="button" role="tab" aria-selected="${view===k}" class="fb-tab${view===k?' on':''}" data-view="${k}">${l}</button>`).join('')}</div>`;
}
function render(){const y=scrollY;app.innerHTML=(mine.preview?'<p class="tlp-note">Vorschau – für die Boxer sichtbar, sobald Karten-Designs freigeschaltet sind.</p>':'')+tabs()+(view==='designs'?designsView():view==='awards'?awardsView():staffView());scrollTo(0,y)}
async function load(){
 const [m,a,pf]=await Promise.all([db.rpc('get_my_card_designs'),db.rpc('get_card_awards'),db.rpc('get_my_performance')]);
 if(m.error)throw m.error;mine=m.data;awards=a.error?null:a.data;perf=pf.error?null:pf.data;
 try{const r=await db.rpc('get_my_personal_design');pd=r.error?null:r.data}catch{pd=null}
 if(mine.enabled)mine.staff=perf&&perf.profile&&['admin','coach'].includes(perf.profile.role);
}
async function loadStaff(){const {data,error}=await db.rpc('staff_card_award_overview');if(error)throw error;staff=data;if(perf&&perf.profile&&perf.profile.role==='admin')await loadPd()}
async function loadPd(){const r=await db.rpc('admin_list_personal_designs');pdList=r.error?[]:r.data||[]}
app.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b||busy)return;
 if(b.dataset.view){view=b.dataset.view;say('');if(view==='staff'&&!staff)await loadStaff().catch(x=>say(x.message,true));render();return}
 if(b.dataset.unskip){
  busy=true;b.disabled=true;
  const {error}=await db.rpc('staff_unskip_card_award',{p_skip_id:Number(b.dataset.unskip)});
  busy=false;
  if(error){say(error.message,true);b.disabled=false;return}
  say('«Nicht vergeben» aufgehoben – du kannst jetzt auszeichnen.');await loadStaff();render();return;
 }
 if(b.dataset.pd){
  busy=true;b.disabled=true;
  const {data,error}=await db.rpc('admin_set_personal_design',{p_profile_id:b.dataset.pd,p_active:b.dataset.on==='1'});
  busy=false;
  if(error){say(error.message,true);b.disabled=false;return}
  say(data.active?'Eigenes Design für '+data.display_name+' freigeschaltet. Die Benachrichtigung ist unterwegs.':'Eigenes Design für '+data.display_name+' entzogen.');
  await loadPd();await load();render();return;
 }
 if(b.dataset.equip||b.dataset.buy){
  busy=true;b.disabled=true;
  const r=b.dataset.buy?await db.rpc('buy_card_design',{p_key:b.dataset.buy}):await db.rpc('equip_card_design',{p_key:b.dataset.equip});
  if(!r.error&&b.dataset.buy){const q=await db.rpc('equip_card_design',{p_key:b.dataset.buy});if(q.error)r.error=q.error}
  busy=false;
  if(r.error){say(r.error.message,true);b.disabled=false;return}
  say(b.dataset.buy?'Gekauft und ausgewählt.':'Design ausgewählt.');await load();render();return;
 }
});
app.addEventListener('input',e=>{
 const f=e.target.closest('.kd-own-form');if(!f)return;
 const prev=app.querySelector('.kd-own-preview');if(prev)prev.innerHTML=previewCard({key:'eigen',name:f.elements.namedItem('dname').value.trim()||pd.name,design:ownDesignFromForm(f),awards:[]},150);
});
app.addEventListener('submit',async e=>{
 const of=e.target.closest('.kd-own-form');
 if(of){e.preventDefault();if(busy)return;busy=true;const btn=of.querySelector('button[type=submit]');btn.disabled=true;
  const {data,error}=await db.rpc('save_my_personal_design',{p_name:of.elements.namedItem('dname').value,p_design:ownDesignFromForm(of)});
  busy=false;btn.disabled=false;
  if(error){say(error.message,true);return}
  say('Design «'+data.name+'» gespeichert.');await load();render();return}
 const rv=e.target.closest('.kd-revoke');
 if(rv){e.preventDefault();const reason=rv.reason.value.trim();if(!reason){say('Bitte einen Grund angeben.',true);return}
  const {error}=await db.rpc('staff_revoke_card_award',{p_award_id:Number(rv.dataset.id),p_reason:reason});
  if(error){say(error.message,true);return}
  say('Auszeichnung zurückgezogen.');await Promise.all([loadStaff(),load()]);render();return}
 const sk=e.target.closest('.kd-skip');
 if(sk){e.preventDefault();if(busy)return;busy=true;
  const {data,error}=await db.rpc('staff_skip_card_award',{p_kind:sk.dataset.kind,p_period_start:sk.dataset.start,p_note:sk.note.value.trim()||null});
  busy=false;
  if(error){say(error.message,true);return}
  say(P.AWARD_LABEL[data.kind]+': diesmal nicht vergeben.');await loadStaff();render();return}
 const f=e.target.closest('.kd-confirm');if(!f)return;e.preventDefault();if(busy)return;busy=true;
 const {data,error}=await db.rpc('staff_confirm_card_award',{p_kind:f.dataset.kind,p_period_start:f.dataset.start,p_profile_id:f.who.value,p_note:f.note.value.trim()||null});
 busy=false;
 if(error){say(error.message,true);return}
 say(P.AWARD_LABEL[data.kind]+': '+data.display_name+' ist ausgezeichnet. Die Benachrichtigung ist unterwegs.');await Promise.all([loadStaff(),load()]);render();
});
(async()=>{
 try{
  db=await P.client();
  const s=await db.auth.getSession();
  if(!s.data||!s.data.session){say('');app.innerHTML='<div class="tlp-panel">Bitte <a href="./login.html">anmelden</a>, um deine Karten zu sehen.</div>';return}
  await load();
  if(!mine.enabled){say('');app.innerHTML='<div class="tlp-panel">Karten-Designs und Auszeichnungen sind noch nicht freigeschaltet.</div>';return}
  const want=new URLSearchParams(location.search).get('view');if(['awards','staff'].includes(want)&&(want!=='staff'||mine.staff)){view=want;if(want==='staff')await loadStaff()}
  say('');render();
 }catch(e){say('Karten konnten nicht geladen werden: '+(e.message||e),true)}
})();
</script>
<script src="./takeover-navigation.js" defer></script></body></html>
