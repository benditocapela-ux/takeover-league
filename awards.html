<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1420"><title>Award-Ranglisten · Takeover League</title><style>
:root{font-family:var(--font);color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--surface-2);color:var(--text);padding:var(--sp-5)}main{max-width:760px;margin:auto}a{color:var(--gold)}header{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-4);flex-wrap:wrap;margin-bottom:var(--sp-7)}.brand{font-size:var(--fs-sm);letter-spacing:2px;font-weight:900;color:var(--gold);text-decoration:none}h1{font-size:clamp(25px,5vw,38px);margin:var(--sp-3) 0 var(--sp-2)}.muted{color:var(--muted)}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--sp-5);margin:var(--sp-4) 0}.tabs,.periods{display:flex;gap:var(--sp-2);flex-wrap:wrap}.tab,.period{border:1px solid var(--line-strong);background:var(--surface);color:var(--text);padding:var(--sp-3) var(--sp-3);border-radius:var(--r-md);font:inherit;font-size:var(--fs-sm);font-weight:700;cursor:pointer}.tab.active,.period.active{background:var(--gold);color:var(--surface-2);border-color:var(--gold)}.rank{display:flex;align-items:center;gap:var(--sp-3);border-top:1px solid var(--line);padding:var(--sp-4) 2px}.rank:first-child{border-top:0}.position{font-size:var(--fs-lg);font-weight:900;min-width:44px;color:var(--gold)}.name{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:700}.value{font-weight:900;font-size:var(--fs-md);white-space:nowrap}.status{min-height:30px}.empty{padding:var(--sp-5) 0;color:var(--muted)}@media(max-width:480px){body{padding:var(--sp-4)}.card{padding:var(--sp-4)}.tab{flex:1 1 42%}.value{font-size:var(--fs-base)}}
</style><link rel="stylesheet" href="./takeover-navigation.css"><link rel="stylesheet" href="./takeover-theme.css"><link rel="stylesheet" href="./takeover-redesign.css"><link rel="stylesheet" href="./takeover-app-shell.css"></head><body data-tl-screen="awards"><main><div class="tl-screen-ribbon" aria-label="Aktueller Bereich: Auszeichnungen"><div class="tl-screen-identity"><span class="tl-screen-symbol" aria-hidden="true">🏅</span><div><div class="tl-screen-eyebrow">TAKEOVER LEAGUE · Anerkennung aus bestätigten Trainings</div><div class="tl-screen-title">Auszeichnungen</div></div></div><div class="tl-screen-links"><a href="./index.html#podium" class="tl-screen-primary">Liga-Podium</a><a href="./index.html#ranking">Ranking</a></div></div><header class="tl-subnav"><a class="brand" href="./index.html"><svg class="tl-icon" aria-hidden="true" focusable="false"><use href="./icons.svg#icon-boxing-glove"></use></svg> TAKEOVER LEAGUE</a><a href="./index.html">← Zurück zum Podium</a></header><h1>Award-Ranglisten</h1><p class="muted">Nur bestätigte Trainings · gleiche Wertung für alle Boxer</p><div class="tabs" id="awards"></div><div class="card"><div class="periods"><button class="period active" data-period="month">Dieser Monat</button><button class="period" data-period="all">Alle Zeiten</button></div><h2 id="heading"></h2><p class="muted" id="description"></p><p class="muted status" id="status" role="status"></p><div id="ranking"></div></div></main><script type="module">
const BASE='https://iqarjivcrddcixrvqbfb.supabase.co';
const KEY='sb_publishable_o--Z21P8Q08lMvIOask_Fw__SRRX7_R';
const awards=[{code:'consistent',title:'👑 Mr. Consistent',unit:'Trainingstage',desc:'Anzahl verschiedener Tage mit mindestens einem bestätigten Training.'},{code:'road_king',title:'🏃 Road King',unit:'km',desc:'Summe der bestätigten Jogging-Kilometer (Road Work).'},{code:'flash',title:'⚡ The Flash',unit:'Sprinteinheiten',desc:'Jedes bestätigte Sprinttraining zählt als genau eine Einheit.'},{code:'technician',title:'🥊 The Technician',unit:'Minuten',desc:'Summe der bestätigten Techniktraining-Minuten.'}];
const $=id=>document.getElementById(id);
const initial=new URLSearchParams(location.search).get('award');let selected=awards.some(a=>a.code===initial)?initial:'consistent';let period='month';let seq=0;
function renderTabs(){const root=$('awards');root.replaceChildren();for(const a of awards){const b=document.createElement('button');b.className='tab'+(selected===a.code?' active':'');b.textContent=a.title;b.addEventListener('click',()=>{selected=a.code;history.replaceState(null,'','?award='+encodeURIComponent(selected));renderTabs();load()});root.append(b)}}
for(const b of document.querySelectorAll('.period'))b.addEventListener('click',()=>{period=b.dataset.period;document.querySelectorAll('.period').forEach(el=>el.classList.toggle('active',el===b));load()});
async function load(){const id=++seq;const a=awards.find(x=>x.code===selected);$('heading').textContent=a.title;$('description').textContent=a.desc;$('status').textContent='Rangliste wird geladen …';$('ranking').replaceChildren();try{const res=await fetch(BASE+'/rest/v1/rpc/get_award_leaderboard',{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify({p_award:selected,p_period:period}),cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status+' – '+(await res.text()).slice(0,180));const rows=await res.json();if(id!==seq)return;$('status').textContent=period==='month'?'Aktueller Monat':'Gesamte Historie';if(!rows.length){$('ranking').textContent='Noch keine bestätigten Leistungen für diese Kategorie vorhanden.';return}for(const r of rows){const line=document.createElement('div');line.className='rank';const n=document.createElement('span');n.className='position';n.textContent='#'+r.rank_position;const name=document.createElement('span');name.className='name';name.textContent=r.boxer_name;const value=document.createElement('span');value.className='value';value.textContent=Number(r.award_value).toLocaleString('de-CH',{maximumFractionDigits:2})+' '+a.unit;line.append(n,name,value);$('ranking').append(line)}}catch(e){if(id!==seq)return;$('status').textContent='Rangliste konnte nicht geladen werden. Bitte später erneut versuchen. '+e.message}}
renderTabs();load();
</script><script src="./takeover-navigation.js" defer></script><script src="./takeover-account.js" defer></script><script src="./takeover-app-shell.js" defer></script></body></html>
