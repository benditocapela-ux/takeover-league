<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1420"><title>Award-Ranglisten · Takeover League</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1420;color:#f4f6f9;padding:20px}main{max-width:760px;margin:auto}a{color:#dfbd77}header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:28px}.brand{font-size:14px;letter-spacing:2px;font-weight:900;color:#dfbd77;text-decoration:none}h1{font-size:clamp(25px,5vw,38px);margin:12px 0 8px}.muted{color:#aebbc9}.card{background:#142238;border:1px solid #314058;border-radius:17px;padding:20px;margin:16px 0}.tabs,.periods{display:flex;gap:8px;flex-wrap:wrap}.tab,.period{border:1px solid #42516b;background:#17273d;color:#eaf0f8;padding:11px 13px;border-radius:11px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}.tab.active,.period.active{background:#dfbd77;color:#101827;border-color:#dfbd77}.rank{display:flex;align-items:center;gap:12px;border-top:1px solid #324158;padding:15px 2px}.rank:first-child{border-top:0}.position{font-size:21px;font-weight:900;min-width:44px;color:#dfbd77}.name{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:700}.value{font-weight:900;font-size:19px;white-space:nowrap}.status{min-height:30px}.empty{padding:18px 0;color:#aebbc9}@media(max-width:480px){body{padding:14px}.card{padding:15px}.tab{flex:1 1 42%}.value{font-size:16px}}
</style></head><body><main><header><a class="brand" href="./index.html">🥊 TAKEOVER LEAGUE</a><a href="./index.html">← Zurück zum Podium</a></header><h1>Award-Ranglisten</h1><p class="muted">Nur bestätigte Trainings · gleiche Wertung für alle Boxer</p><div class="tabs" id="awards"></div><div class="card"><div class="periods"><button class="period active" data-period="month">Dieser Monat</button><button class="period" data-period="all">Alle Zeiten</button></div><h2 id="heading"></h2><p class="muted" id="description"></p><p class="muted status" id="status" role="status"></p><div id="ranking"></div></div></main><script type="module">
const BASE='https://iqarjivcrddcixrvqbfb.supabase.co';
const KEY='sb_publishable_o--Z21P8Q08lMvIOask_Fw__SRRX7_R';
const awards=[{code:'consistent',title:'👑 Mr. Consistent',unit:'Trainingstage',desc:'Anzahl verschiedener Tage mit mindestens einem bestätigten Training.'},{code:'road_king',title:'🏃 Road King',unit:'km',desc:'Summe der bestätigten Jogging-Kilometer (Road Work).'},{code:'flash',title:'⚡ The Flash',unit:'Sprinteinheiten',desc:'Jedes bestätigte Sprinttraining zählt als genau eine Einheit.'},{code:'technician',title:'🥊 The Technician',unit:'Minuten',desc:'Summe der bestätigten Techniktraining-Minuten.'}];
const $=id=>document.getElementById(id);
const initial=new URLSearchParams(location.search).get('award');let selected=awards.some(a=>a.code===initial)?initial:'consistent';let period='month';let seq=0;
function renderTabs(){const root=$('awards');root.replaceChildren();for(const a of awards){const b=document.createElement('button');b.className='tab'+(selected===a.code?' active':'');b.textContent=a.title;b.addEventListener('click',()=>{selected=a.code;history.replaceState(null,'','?award='+encodeURIComponent(selected));renderTabs();load()});root.append(b)}}
for(const b of document.querySelectorAll('.period'))b.addEventListener('click',()=>{period=b.dataset.period;document.querySelectorAll('.period').forEach(el=>el.classList.toggle('active',el===b));load()});
async function load(){const id=++seq;const a=awards.find(x=>x.code===selected);$('heading').textContent=a.title;$('description').textContent=a.desc;$('status').textContent='Rangliste wird geladen …';$('ranking').replaceChildren();try{const res=await fetch(BASE+'/rest/v1/rpc/get_award_leaderboard',{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify({p_award:selected,p_period:period}),cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status+' – '+(await res.text()).slice(0,180));const rows=await res.json();if(id!==seq)return;$('status').textContent=period==='month'?'Aktueller Monat':'Gesamte Historie';if(!rows.length){$('ranking').textContent='Noch keine bestätigten Leistungen für diese Kategorie vorhanden.';return}for(const r of rows){const line=document.createElement('div');line.className='rank';const n=document.createElement('span');n.className='position';n.textContent='#'+r.rank_position;const name=document.createElement('span');name.className='name';name.textContent=r.boxer_name;const value=document.createElement('span');value.className='value';value.textContent=Number(r.award_value).toLocaleString('de-CH',{maximumFractionDigits:2})+' '+a.unit;line.append(n,name,value);$('ranking').append(line)}}catch(e){if(id!==seq)return;$('status').textContent='Rangliste konnte nicht geladen werden. Bitte prüfen, ob die SQL-Funktion installiert wurde. '+e.message}}
renderTabs();load();
</script></body></html>
