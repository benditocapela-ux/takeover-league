<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>Takeover League 2.0 – UX Preview</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#eaf0fa;background:#0b1220}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #344863;background:#192b43;color:#eaf0fa;border-radius:12px;padding:12px;min-height:44px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #62d6fa}button.primary{background:#f0b938;color:#17202b;border-color:#f0b938;font-weight:750}.shell{max-width:1060px;margin:auto;padding:18px 18px 92px}.muted{color:#9db0c7}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.top h1{font-size:23px;margin:0}.hint{background:#20314b;border:1px solid #3f5269;border-radius:12px;padding:10px;margin:14px 0}.nav{display:flex;gap:6px;overflow:auto;padding:15px 0;scrollbar-width:thin}.nav button[aria-current=page]{background:#f0b938;color:#132034}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.panel{border:1px solid #314760;border-radius:17px;padding:18px;background:#111f33;margin:12px 0}.panel h2{margin:0 0 10px;font-size:18px}.stat{font-size:30px;font-weight:750}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.list{display:grid;gap:8px}.item{padding:11px;border:1px solid #314760;border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}input,select{color:#fff;background:#13253a;border:1px solid #526780;border-radius:10px;min-height:44px;padding:10px;width:100%}label{display:grid;gap:5px;margin:9px 0}.progress{height:10px;border-radius:20px;background:#314760;overflow:hidden}.progress>div{height:100%;background:#f0b938}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.cardsmall{font-size:13px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0b1220ed;border-top:1px solid #314760;display:flex;justify-content:space-around;padding:9px}.bottom button{font-size:12px;padding:7px 8px;min-height:44px}.dialog{border:1px solid #526780;border-radius:18px;background:#111f33;color:#fff;width:min(460px,calc(100% - 24px))}.dialog::backdrop{background:#000b}small{color:#9db0c7} @media(max-width:580px){.shell{padding:15px 12px 90px}.top h1{font-size:19px}.nav{display:none}}
</style><style>
.nav{position:sticky;top:0;z-index:5;background:#0b1220}.top{position:sticky;top:0;z-index:6;background:#0b1220;padding:7px 0}
@media(max-width:580px){.bottom{z-index:8;padding-bottom:max(9px,env(safe-area-inset-bottom))}.dialog{margin:auto 0 0;width:100%;max-width:none;border-radius:20px 20px 0 0;max-height:85vh;overflow:auto}}
.status{display:inline-block;border:1px solid #62748e;background:#20314b;border-radius:20px;padding:2px 8px;font-size:12px}
.toast{position:fixed;z-index:12;bottom:75px;right:15px;max-width:330px;padding:12px;background:#203b52;border:1px solid #66809b;border-radius:14px;box-shadow:0 8px 25px #0009}
</style></head><body>
<main class="shell">
<header class="top"><div><h1>🥊 TAKEOVER LEAGUE 2.0</h1><small>Entwicklungs-Vorschau · keine Live-Daten</small></div><button id="coach-toggle">Traineransicht: Aus</button></header>
<div class="hint">Interaktiver UX-Prototyp: Beispieldaten und lokale Trainingsentwürfe. Keine Punkte, Duelle oder Freigaben werden an Supabase übertragen.</div>
<nav class="nav" id="nav" aria-label="Hauptnavigation"></nav>
<div id="page" aria-live="polite"></div>
</main>
<nav class="bottom" aria-label="Mobile Navigation" id="bottom"></nav>
<dialog class="dialog" id="profile-dialog"><div id="profile-content"></div><div class="actions" style="margin-top:18px"><button id="close-dialog">Schliessen</button></div></dialog>
<script>
'use strict';
const people=[{id:'a',name:'Alex',points:780,xp:2420,level:12,trainings:16},{id:'b',name:'Jordan',points:650,xp:2020,level:10,trainings:14},{id:'c',name:'Sam',points:510,xp:1480,level:8,trainings:12},{id:'d',name:'Taylor',points:390,xp:990,level:6,trainings:9}];
const types={Boxtraining:50,Sparring:70,Techniktraining:40,Krafttraining:30,'Sprint-Intervalle':40,Joggen:20};
const pages=[['dashboard','Dashboard'],['ranking','Ranking'],['levels','Levels'],['training','Training'],['duels','Duelle'],['challenges','Challenges'],['achievements','Achievements'],['coach','Coach']];
let page='dashboard',coach=false,filter='',selected='a';
const $=id=>document.getElementById(id),escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const drafts=()=>{try{return JSON.parse(localStorage.getItem('tl2_drafts')||'[]')}catch{return []}};
function nav(){const available=pages.filter(p=>coach||p[0]!=='coach');$('nav').innerHTML=available.map(([id,name])=>`<button data-page="${id}" ${page===id?'aria-current="page"':''}>${name}</button>`).join('');$('bottom').innerHTML=available.slice(0,5).map(([id,name])=>`<button data-page="${id}" ${page===id?'aria-current="page"':''}>${name}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;render()}));}
function profile(id){const p=people.find(x=>x.id===id);if(!p)return;selected=id;$('profile-content').innerHTML=`<h2>${escape(p.name)}</h2><p>Level ${p.level} · ${p.xp} EXP · ${p.points} Monatspunkte</p><p>${p.trainings} bestätigte Trainingseinheiten (Beispieldaten)</p><div class="actions"><button id="challenge-person" class="primary">Herausfordern</button>${coach?'<button id="assign-person">Challenge zuweisen</button>':''}</div><p id="modal-feedback" role="status"></p>`;$('profile-dialog').showModal();$('challenge-person').onclick=()=>{$('modal-feedback').textContent='Duell-Anfrage: Vorschau. Backend-Anbindung noch erforderlich.'};if(coach)$('assign-person').onclick=()=>{$('modal-feedback').textContent='Trainer-Zuweisung: Vorschau. Backend-Anbindung noch erforderlich.'};}
function profileRows(arr){return `<div class="list">${arr.map((p,i)=>`<div class="item"><div><b>#${i+1} ${escape(p.name)}</b><div class="muted cardsmall">Level ${p.level} · ${p.trainings} Trainings</div></div><div><b>${p.points} P</b> <button data-profile="${p.id}" aria-label="Profil von ${escape(p.name)} ansehen">Profil ansehen</button></div></div>`).join('')}</div>`;}
function chart(){const vals=[270,420,360,550,680,780];return `<div class="row" style="align-items:end;height:120px">${vals.map((x,i)=>`<div style="flex:1;text-align:center"><div style="height:${Math.round(x/780*85)}px;background:#f0b938;border-radius:5px 5px 0 0"></div><small>W${i+1}</small></div>`).join('')}</div><small>Beispielverlauf, keine echten Trainingsdaten</small>`;}
function render(){if(!coach&&page==='coach')page='dashboard';nav();let out='';
if(page==='dashboard')out=`<div class="grid"><section class="panel"><h2>Deine Monatspunkte</h2><div class="stat">780</div><small>Demo-Profil Alex</small></section><section class="panel"><h2>Lifetime EXP</h2><div class="stat">2'420</div><div class="progress"><div style="width:68%"></div></div><small>68 % bis zum nächsten Level (Demo)</small></section><section class="panel"><h2>Trainings-Streak</h2><div class="stat">4 Tage 🔥</div><small>Beispieldaten</small></section></div><div class="panel"><h2>Schnellaktionen</h2><div class="actions"><button class="primary" data-page="training">Training erfassen</button><button data-page="duels">Duelle ansehen</button><button data-page="ranking">Ranking öffnen</button></div></div><div class="panel"><h2>Fortschritt</h2>${chart()}</div>`;
if(page==='ranking')out=`<section class="panel"><h2>Monatsranking</h2><label>Boxer suchen<input id="search" value="${escape(filter)}" placeholder="Name eingeben"></label><div id="ranking-list">${profileRows(people.filter(p=>p.name.toLowerCase().includes(filter.toLowerCase())).sort((a,b)=>b.points-a.points))}</div></section>`;
if(page==='levels')out=`<section class="panel"><h2>Lifetime Levels</h2><p class="muted">Monatspunkte und dauerhafte EXP werden getrennt geführt.</p>${people.map(p=>`<div class="item"><span>${escape(p.name)} · Level ${p.level}</span><span>${p.xp} EXP <button data-profile="${p.id}">Profil</button></span></div>`).join('')}</section>`;
if(page==='training')out=`<div class="grid"><section class="panel"><h2>Training erfassen</h2><form id="training-form"><label>Trainingsart<select id="type">${Object.entries(types).map(([t,pts])=>`<option value="${escape(t)}">${escape(t)} · ${pts} Punkte</option>`).join('')}</select></label><label>Datum<input id="date" type="date" required></label><label>Notiz (optional)<input id="note" maxlength="180" placeholder="Wie lief das Training?"></label><div class="actions"><button class="primary" type="submit">Entwurf speichern</button></div></form><p id="saved" role="status"></p></section><section class="panel"><h2>Meine Entwürfe</h2><div id="draft-list"></div></section></div><section class="panel"><h2>Trainingskalender</h2><p class="muted">Eine nach Datum sortierte Übersicht deiner gespeicherten Entwürfe. Bestätigte Einheiten werden später angebunden.</p><div id="calendar-list"></div></section>`;
if(page==='duels')out=`<section class="panel"><h2>Live-Duellübersicht</h2><p>Alex <b>380</b> : <b>340</b> Jordan</p><div class="progress"><div style="width:53%"></div></div><small>7-Tage-Duell · illustrative Werte, nicht live</small></section><section class="panel"><h2>Gegner herausfordern</h2>${profileRows(people.filter(p=>p.id!=='a'))}</section>`;
if(page==='challenges')out=`<section class="panel"><h2>Challenge-Fortschritt</h2><p><b>Roadwork Week</b> · 3 von 5 Laufeinheiten (Demo)</p><div class="progress"><div style="width:60%"></div></div><p class="muted">Eine reale Challenge benötigt Trainerfreigabe und Datenbankanbindung.</p></section><section class="panel"><h2>Persönliche Ziele</h2><p>Beispielziel: 4 Trainings pro Woche</p><div class="progress"><div style="width:75%"></div></div></section>`;
if(page==='achievements')out=`<section class="panel"><h2>Achievements</h2>${['Training Warrior','Mr. Consistent','Road King','The Flash','The Technician','Iron Fighter','Iron Engine','Complete Boxer'].map((n,i)=>`<div class="item"><span>🏅 ${n}</span><span>${i<3?'Bronze':'Noch offen'} · Demo</span></div>`).join('')}</section>`;
if(page==='coach')out=`<div class="grid">${[['Trainingsfreigaben','3 offene Vorgänge'],['Bonuspunkte','Nur Trainer'],['Challenges','Erstellen / zuweisen'],['Änderungshistorie','Audit-Log nach Backend-Anbindung']].map(([a,b])=>`<div class="panel"><h2>${a}</h2><p class="muted">${b}</p></div>`).join('')}</div><div class="hint">Traineransicht ist im Prototyp nur ein UI-Schalter und keine Authentifizierung. Produktive Aktionen müssen serverseitig per Supabase-Rollenrechten geschützt werden.</div>`;
$('page').innerHTML=out;
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>profile(b.dataset.profile));
if(page==='ranking')$('search').oninput=e=>{filter=e.target.value;$('ranking-list').innerHTML=profileRows(people.filter(p=>p.name.toLowerCase().includes(filter.toLowerCase())).sort((a,b)=>b.points-a.points));document.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>profile(b.dataset.profile));};
if(page==='training'){const today=new Date().toISOString().slice(0,10);$('date').value=today;$('date').max=today;$('training-form').onsubmit=e=>{e.preventDefault();const d={id:Date.now(),type:$('type').value,date:$('date').value,note:$('note').value};if(!d.date||d.date>today)return;const current=drafts();current.push(d);localStorage.setItem('tl2_drafts',JSON.stringify(current));$('saved').textContent='Entwurf nur auf diesem Gerät gespeichert – noch nicht eingereicht.';showDrafts();};showDrafts();}
}
function showDrafts(){const ds=drafts().sort((a,b)=>b.date.localeCompare(a.date));$('draft-list').innerHTML=ds.length?ds.map(d=>`<div class="item"><span>${escape(d.type)} · ${escape(d.date)}</span><button data-delete="${d.id}">Entwurf löschen</button></div>`).join(''):'<p class="muted">Noch keine Entwürfe</p>';$('calendar-list').innerHTML=ds.map(d=>`<div class="item">${escape(d.date)} · ${escape(d.type)}</div>`).join('')||'<p class="muted">Keine Einträge</p>';document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(!confirm('Diesen lokalen Entwurf wirklich löschen?'))return;localStorage.setItem('tl2_drafts',JSON.stringify(drafts().filter(d=>String(d.id)!==b.dataset.delete)));showDrafts()});}
$('coach-toggle').onclick=()=>{coach=!coach;$('coach-toggle').textContent='Traineransicht: '+(coach?'An':'Aus');render()};$('close-dialog').onclick=()=>$('profile-dialog').close();render();
</script><script>
/* UX 21-45: staged browser-only enhancements, not privileged backend operations */
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const notify=message=>{document.querySelector('.toast')?.remove();let el=document.createElement('div');el.className='toast';el.role='status';el.textContent=message;document.body.appendChild(el);setTimeout(()=>el.remove(),3000)};
let lastScroll={};const originalRender=render;
render=function(){lastScroll[page]=window.scrollY;originalRender();enhance();const restore=lastScroll[page];if(Number.isFinite(restore))requestAnimationFrame(()=>window.scrollTo(0,restore));};
const originalProfile=profile;
profile=function(id){store('tl2_recent', [id,...read('tl2_recent',[]).filter(x=>x!==id)].slice(0,5));originalProfile(id)};
function enhance(){
 if(page==='ranking'){const self=document.createElement('div');self.className='actions';self.style.margin='8px 0';self.innerHTML='<button id="my-position">Zu meiner Position springen (Demo: Alex)</button>';const box=$('ranking-list');box.before(self);$('my-position').onclick=()=>{filter='Alex';$('search').value='Alex';$('search').dispatchEvent(new Event('input'));$('ranking-list').scrollIntoView({behavior:'smooth',block:'center'});notify('Demo-Profil Alex angezeigt')};}
 if(page==='training'){const form=$('training-form');const defaults=read('tl2_last_training',{});const autosave=read('tl2_form_autosave',{});const last=read('tl2_drafts',[]).at(-1);
  $('type').value=autosave.type||defaults.type||'Boxtraining';if(autosave.date)$('date').value=autosave.date;if(autosave.note)$('note').value=autosave.note;
  const row=document.createElement('div');row.className='actions';row.innerHTML='<button type="button" id="repeat-last">Letztes Training übernehmen</button><button type="button" id="reset-form">Formular zurücksetzen</button>';form.before(row);
  $('repeat-last').onclick=()=>{const item=last||defaults;if(!item.type){notify('Noch kein vorheriges Training vorhanden');return}$('type').value=item.type;$('note').value=item.note||'';$('date').value=new Date().toLocaleDateString('sv-SE');notify('Letzte Trainingsart übernommen')};
  $('reset-form').onclick=()=>{store('tl2_form_autosave',{});$('note').value='';$('type').value='Boxtraining';$('date').value=new Date().toLocaleDateString('sv-SE');notify('Eingabe zurückgesetzt')};
  form.addEventListener('input',()=>store('tl2_form_autosave',{type:$('type').value,date:$('date').value,note:$('note').value}));
  form.addEventListener('submit',()=>{store('tl2_last_training',{type:$('type').value,note:$('note').value});store('tl2_form_autosave',{});}, {capture:true});
  const info=document.createElement('p');info.className='muted';info.innerHTML='<span class="status">Entwurf</span> Lokal gespeichert · <span class="status">Eingereicht</span> Noch nicht verbunden · <span class="status">Bestätigt</span> Nur durch Trainer';form.after(info);
 }
 if(page==='coach'){const panel=document.createElement('section');panel.className='panel';panel.innerHTML='<h2>Coach-Aktionszentrale – Demo</h2><label>Offene Einträge filtern<input id="coach-filter" placeholder="Boxer oder Training"></label><div class="actions"><button id="select-all">Alle sichtbaren wählen</button><button id="bulk-approve" class="primary">Auswahl prüfen</button><button id="coach-undo">Letzte Demoaktion rückgängig</button></div><div id="coach-worklist" class="list"></div><p id="coach-message" role="status" class="muted"></p><h2>Zuletzt angesehene Boxer</h2><div id="coach-recent" class="actions"></div>';
  $('page').prepend(panel);let tasks=read('tl2_coach_demo_tasks',[{id:101,boxer:'Alex',kind:'Boxtraining',status:'Offen'},{id:102,boxer:'Jordan',kind:'Sparring',status:'Offen'},{id:103,boxer:'Sam',kind:'Joggen',status:'Offen'}]);let undo=null;
  const draw=()=>{const q=$('coach-filter').value.toLowerCase();let visible=tasks.filter(t=>t.status==='Offen'&&(t.boxer+' '+t.kind).toLowerCase().includes(q));$('coach-worklist').innerHTML=visible.length?visible.map(t=>'<label class="item"><span><input type="checkbox" class="task-check" value="'+t.id+'" style="width:auto;min-height:0"> '+esc(t.boxer)+' · '+esc(t.kind)+'</span><span class="status">Offen</span></label>').join(''):'<p class="muted">Keine offenen Aufgaben für diese Auswahl</p>';};
  $('coach-filter').oninput=draw;$('select-all').onclick=()=>document.querySelectorAll('.task-check').forEach(c=>c.checked=true);
  $('bulk-approve').onclick=()=>{const ids=[...document.querySelectorAll('.task-check:checked')].map(c=>Number(c.value));if(!ids.length){notify('Zuerst Einträge auswählen');return}if(!confirm(ids.length+' Demo-Einträge als geprüft markieren? Es erfolgt KEINE Serverfreigabe.'))return;undo=tasks.map(t=>({...t}));tasks=tasks.map(t=>ids.includes(t.id)?{...t,status:'Demo-geprüft'}:t);store('tl2_coach_demo_tasks',tasks);draw();$('coach-message').textContent=ids.length+' Demo-Vorgänge geprüft (nicht an Supabase übertragen).';};
  $('coach-undo').onclick=()=>{if(!undo){notify('Keine rückgängig machbare Demoaktion');return}tasks=undo;undo=null;store('tl2_coach_demo_tasks',tasks);draw();notify('Demoaktion rückgängig gemacht')};
  $('coach-recent').innerHTML=read('tl2_recent',[]).map(id=>people.find(p=>p.id===id)).filter(Boolean).map(p=>'<button data-recent="'+esc(p.id)+'">'+esc(p.name)+'</button>').join('')||'<p class="muted">Noch keine Boxer geöffnet</p>';document.querySelectorAll('[data-recent]').forEach(b=>b.onclick=()=>profile(b.dataset.recent));draw();
 }
}
enhance();
})();
</script></body></html>
