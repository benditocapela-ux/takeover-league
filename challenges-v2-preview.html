<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coach Challenges · Takeover League</title>
<style>body{font:16px system-ui;background:#0b1422;color:#f5f5f6;margin:0;padding:20px}main{max-width:920px;margin:auto}a{color:#dfbd77}h1{color:#dfbd77}article{background:#16263a;border:1px solid #324359;border-radius:14px;padding:18px;margin:14px 0}button{background:#dfbd77;color:#111;border:0;border-radius:8px;padding:10px 14px;margin:5px;cursor:pointer}button:disabled{opacity:.5}input,textarea,select{background:#0b1422;color:white;border:1px solid #52647c;border-radius:8px;padding:10px;max-width:100%;box-sizing:border-box}form{display:grid;gap:10px;max-width:550px}small{color:#bdc8d4}.error{color:#ffb6b6}</style></head>
<body><main><p><a href="./boxer.html">Boxer</a> · <a href="./coach.html">Coach</a></p><h1>Coach Challenges V2</h1><p id="status" role="status">Verbindung wird geprüft …</p><section id="coach" hidden><h2>Challenge erstellen</h2><form id="create"><input name="title" required maxlength="120" placeholder="Titel"><textarea name="description" placeholder="Beschreibung"></textarea><select name="kind"><option value="individual">Individuell</option><option value="group">Gruppe</option></select><input name="days" type="number" min="1" max="365" value="7" required><button>Entwurf erstellen</button></form></section><section id="list"></section></main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const status=document.querySelector('#status'),list=document.querySelector('#list'),coach=document.querySelector('#coach');
const say=(s,error=false)=>{status.textContent=s;status.className=error?'error':''};
const el=(tag,text)=>{const e=document.createElement(tag);e.textContent=text;return e};
let db;
async function rpc(name,args={}){const r=await db.rpc(name,args);if(r.error)throw r.error;return r.data}
async function act(name,args){try{say('Wird verarbeitet …');await rpc(name,args);await load()}catch(e){say(e.message,true)}}
function action(parent,label,name,id){const b=el('button',label);b.onclick=()=>act(name,{p_challenge_id:id});parent.append(b)}
async function load(){const data=await rpc('coach_challenge_v2_list');list.replaceChildren();for(const c of data||[]){const a=document.createElement('article');a.append(el('h2',c.title),el('p',c.description||''),el('small',c.status+' · '+c.joined_count+' Teilnehmende · '+c.duration_days+' Tage'));if(c.status==='open'&&!c.my_enrollment_status)action(a,'Teilnehmen','coach_challenge_v2_join',c.id);if(c.my_enrollment_status==='joined'&&c.status==='open')action(a,'Teilnahme zurückziehen','coach_challenge_v2_withdraw',c.id);if(c.is_creator&&c.status==='draft'){action(a,'Öffnen','coach_challenge_v2_manage',c.id);a.lastChild.onclick=()=>act('coach_challenge_v2_manage',{p_challenge_id:c.id,p_action:'open'});}list.append(a)}say((data||[]).length+' Challenges geladen.')}
async function init(){try{const cfg=await fetch('./config.js');if(!cfg.ok)throw Error('config.js nicht erreichbar');const js=await cfg.text();const url=js.match(/https:\/\/[^\s'"\x60]+\.supabase\.co/);const key=js.match(/(?:eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+|sb_publishable_[A-Za-z0-9_-]+)/);if(!url||!key)throw Error('Supabase-Konfiguration nicht erkannt');db=createClient(url[0],key[0]);const {data:{user}}=await db.auth.getUser();if(!user)throw Error('Bitte zuerst anmelden.');const p=await db.from('profiles').select('role,is_active').eq('auth_user_id',user.id).maybeSingle();if(p.error||!p.data?.is_active)throw Error('Kein aktives Profil');coach.hidden=!['admin','coach'].includes(p.data.role);await load()}catch(e){say(e.message,true)}}
document.querySelector('#create').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await rpc('coach_challenge_v2_create_draft',{p_title:f.get('title'),p_description:f.get('description'),p_kind:f.get('kind'),p_duration_days:Number(f.get('days'))});e.target.reset();await load()}catch(err){say(err.message,true)}};
init();
</script></body></html>
