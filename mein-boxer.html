<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mein Boxer · Takeover League</title>
<style>:root{color-scheme:dark;font:16px system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;padding:var(--sp-5) var(--sp-4) 110px;background:var(--bg);color:var(--text)}main{max-width:880px;margin:auto}h1{color:var(--gold)}a{color:var(--gold)}button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}</style>
<link rel="stylesheet" href="./takeover-navigation.css"><link rel="stylesheet" href="./takeover-theme.css"><link rel="stylesheet" href="./takeover-redesign.css"><link rel="stylesheet" href="./takeover-mein-boxer.css"></head><body data-tl-screen="mein-boxer">
<main><div class="tl-screen-ribbon" aria-label="Aktueller Bereich: Mein Boxer"><div class="tl-screen-identity"><span class="tl-screen-symbol" aria-hidden="true">🥊</span><div><div class="tl-screen-eyebrow">TAKEOVER LEAGUE · Dein Boxer-Holo</div><div class="tl-screen-title">Mein Boxer</div></div></div><div class="tl-screen-links"><a href="./mein-boxer.html" class="tl-screen-primary">Mein Boxer</a><a href="./shop.html">Shop</a><a href="./boxer.html">Mein Studio</a></div></div>
<p class="tl-subnav"><a href="./boxer.html">← Mein Studio</a></p>
<h1 id="pageTitle">Mein Boxer</h1>
<p id="status" class="tlp-status" role="status" aria-live="polite">Wird geladen …</p>
<div id="app"></div>
</main>
<script src="./takeover-performance.js" defer></script>
<script src="./takeover-holo.js" defer></script>
<script type="module">
const $=id=>document.getElementById(id),app=$('app'),status=$('status');
let statusTimer=null;
const say=(t,err)=>{
 if(statusTimer){clearTimeout(statusTimer);statusTimer=null}
 status.textContent=t;status.classList.toggle('error',!!err);status.hidden=!t;
 // Success messages are accessible and temporary; errors remain until resolved.
 if(t&&!err&&!/läuft/.test(t))statusTimer=setTimeout(()=>{status.hidden=true;statusTimer=null},3000);
};
await new Promise(r=>{const ok=()=>window.TLPerf&&window.TLHolo;if(ok())return r();const t=setInterval(()=>{if(ok()){clearInterval(t);r()}},30)});
// All visual modules are optional. A stale PWA/offline cache must not disable
// boxing profile editing, saving or purchases when one extra art file is missing.
await Promise.allSettled([
 import('./takeover-mein-boxer-items.js'),
 import('./takeover-mein-boxer-layers.js'),
 import('./takeover-mein-boxer-artpack-manifest.js')
]);
try{await import('./takeover-mein-boxer-artpack.js')}
catch(e){console.warn('Optional boxer art-pack unavailable; continuing with SVG',e)}
const P=window.TLPerf,H=window.TLHolo,G=window.TLGearArt,A=window.TLBoxerArtPacks,esc=P.esc;
// Production is explicitly disabled until BOTH art approval and launch enablement.
// ?art=preview remains available for artists without activating live characters.
const tryPremiumArt=new URLSearchParams(location.search).get('art')==='preview';
const referenceReview=new URLSearchParams(location.search).get('art')==='reference';
let referenceSrc=null,referenceVisible=false;
function referenceNotice(){
 if(!referenceReview)return '';
 return '<div class="mb-reference-tools" role="group" aria-label="Nur lokaler Referenzvergleich">'+
  '<label for="mb-reference-file">Anime-Referenz laden (PNG/WebP, 768 × 1216)</label>'+
  '<input id="mb-reference-file" type="file" accept="image/png,image/webp" aria-describedby="mb-reference-note">'+
  (referenceSrc?'<button type="button" class="mb-btn mb-reference-toggle" data-reference-toggle="1" aria-pressed="'+referenceVisible+'">'+
   (referenceVisible?'Bearbeitbaren Boxer anzeigen':'Anime-Referenz anzeigen')+'</button>':'')+
  '<small id="mb-reference-note">Nur lokale Designvorschau, keine Speicherung. Bei einer Ausrüstungsänderung erscheint wieder dein echter Boxer.</small></div>';
}

const artManifest=window.TLBoxerArtPackManifest;
const livePremiumArt=!!(A&&A.active&&artManifest?.approved===true&&artManifest?.enabled===true);
const usePremiumArt=tryPremiumArt||livePremiumArt;
const canCompareArt=!!(tryPremiumArt&&A&&A.active&&artManifest?.approved===true);
let compareSvg=false;
const heroArt=(config,pose)=>{
 const normalized=H.normalize(config);
 // A local user's whole-body reference is a non-editable design overlay only.
 // It is never persisted, released, or presented as a layer-based outfit.
 if(referenceReview&&referenceVisible&&referenceSrc)
  return '<img class="mb-reference-figure" src="'+esc(referenceSrc)+'" alt="Anime-Referenz nur zum visuellen Vergleich" decoding="async">';
 // Render only fully loaded artwork. A stale load can only re-render current cfg.
 if(usePremiumArt&&!compareSvg&&A&&A.active.prepare(normalized,pose,refreshHero)){
  const ready=A.active.render(normalized,pose);
  if(ready)return ready;
 }
 return H.svg(config,{pose,label:'Dein Boxer-Holo',premium:true,holo:false,layered:true});
};
// Async image completion only replaces the figure: never reset editing focus,
// equipment scroll positions or the active selection tab.
function refreshHero(){
 const preview=app.querySelector('.mb-preview');
 if(!preview||!cfg)return;
 const pose=previewPose==='card'?cfg.pose_card:cfg.pose_profile;
 preview.innerHTML=heroArt(cfg,pose)+artDebugLabel(cfg,pose);
}
// Diagnostics are only exposed to editors explicitly using ?art=preview.
// Nothing is added to public cards, profiles or normal Studio operation.
function artDebugLabel(config,pose){
 if(!tryPremiumArt)return '';
 if(compareSvg)return '<span class="mb-art-debug" role="status" data-art-state="manual-svg">Vergleich: Original-SVG</span>';
 const info=A&&A.active&&A.active.inspect
  ?A.active.inspect(H.normalize(config),pose)
  :{state:'unavailable',detail:''};
 const words={
  'unapproved':'Grafikpaket nicht freigegeben',
  'unavailable':'Grafikmodul nicht geladen',
  'missing-pose':'Pose fehlt',
  'unsupported-effect':'Effekt nutzt SVG',
  'missing-layer':'Grafikebene fehlt',
  'invalid-path':'Ungültige Grafikdatei',
  'load-failed':'Grafik konnte nicht geladen werden',
  'loading':'Grafik wird vorgeladen',
  'ready':'Premium-Grafik bereit'
 };
 const title=(words[info.state]||'SVG-Fallback')+(info.detail?' · '+info.detail:'');
 const progress=info.state==='loading'?' ('+info.loaded+'/'+info.total+')':'';
 return '<span class="mb-art-debug" role="status" data-art-state="'+esc(info.state)+'" title="'+esc(title)+'">'+
  esc(title+progress)+'</span>';
}
const COIN='<svg class="mb-coin" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#ffcc33"/><circle cx="12" cy="12" r="8" fill="#e8a91a"/></svg>';
const fmt=n=>Number(n||0).toLocaleString('de-CH');
const OPT={
 head:[['none','Ohne'],['cap','Kappe'],['band','Stirnband'],['hijab','Sport-Hijab']],
 top:[['none','Ohne'],['tank','Tanktop'],['shirt','T-Shirt'],['hoodie','Hoodie'],['jacke','Trainingsjacke']],
 bottom:[['boxer','Boxershorts'],['kurz','Kurze Hose'],['jogger','Jogginghose'],['track','Trainingshose']],
 hands:[['wraps','Bandagen'],['gloves','Handschuhe']],
 feet:[['boots','Boxstiefel'],['sneaker','Sneaker']]
};
const SLOT_TITLE={coat:'Mäntel',glove:'Handschuhe',aura:'Auren',eyefx:'Spezial-Augen',scene:'Hintergründe',pose:'Posen'};
let db,data=null,cfg=null,saved='',tab='koerper',busy=false,confirmBuy=null,coatChoice='basic',previewPose='profile';
const items=()=>data.items||[];
const item=(slot,v)=>items().find(i=>i.slot===slot&&i.value===v);
const locked=(slot,v)=>{const it=item(slot,v);return !!(it&&!it.owned)};
const lockTag=it=>it&&!it.owned?`<em class="mb-lock">${it.unlock==='shop'?COIN+fmt(it.price):esc(it.reward||'Belohnung')}</em>`:'';
const tryOn=()=>{const l=[];const chk=(slot,v,lab)=>{const it=item(slot,v);if(it&&!it.owned)l.push(lab||it.name)};
 for(const s of ['coat','aura','eyefx','scene'])if(cfg[s]&&cfg[s]!=='none')chk(s,cfg[s]);
 if(cfg.hands==='gloves')chk('glove',cfg.glove,'Handschuhe '+(item('glove',cfg.glove)||{}).name);
 chk('hair',cfg.hair);chk('pose',cfg.pose_profile,'Pose '+(item('pose',cfg.pose_profile)||{}).name);chk('pose',cfg.pose_card,'Pose '+(item('pose',cfg.pose_card)||{}).name);
 return [...new Set(l)]};
const dirty=()=>JSON.stringify(cfg)!==saved;
const chip=(field,v,label,on,extra)=>`<button type="button" class="mb-chip" data-set="${field}" data-val="${esc(v)}" aria-pressed="${on}">${label}${extra||''}</button>`;
// Die Item-Vorschau ist dieselbe SVG-Zeichnung wie der echte Boxer, keine separate Attrappe.
// Alle Auswahl-IDs und data-set/data-val Events bleiben unverändert.
function itemLook(slot,value){
 const look=Object.assign({},cfg,{scene:'holo',aura:'none'});
 if(['head','top','bottom','hands','feet'].includes(slot))look.coat='none';
 if(slot==='head'){look.head=value;look.hood=false;look.top='none'}
 else if(slot==='top'){look.top=value;look.hood=value==='hoodie'&&cfg.hood}
 else if(slot==='bottom'){look.bottom=value;look.top='none'}
 else if(slot==='hands'){look.hands=value}
 else if(slot==='feet'){look.feet=value}
 else if(slot==='glove'){look.hands='gloves';look.glove=value;look.coat='none'}
 else if(slot==='coatPick'||slot==='coat')look.coat=value;
 else if(slot==='aura')look.aura=value;
 else if(slot==='eyefx')look.eyefx=value;
 else if(slot==='scene')look.scene=value;
 else if(slot==='pose')look.pose_profile=value;
 return look;
}
function gearChip(field,v,label,on,extra){
 const slot=field==='coatPick'?'coat':field;
 const look=itemLook(field,v);
 const klass=slot==='glove'||slot==='hands'?'hands':slot;
 const scene=slot==='scene'?v:'none';
 const content=G&&G.supports(field,v)?G.svg(field,v,look):H.svg(look,{pose:'guard',scene,holo:false});
 return `<button type="button" class="mb-chip mb-gear-chip" data-set="${field}" data-val="${esc(v)}" aria-label="${esc(label)}" aria-pressed="${on}"><span class="mb-gear-art mb-gear-${klass}" aria-hidden="true">${content}</span><span class="mb-gear-name">${esc(label)}</span>${extra||''}</button>`;
}
const sw=(field,v,color,label,on)=>`<button type="button" class="mb-sw" data-set="${field}" data-val="${esc(v)}" aria-pressed="${on}" aria-label="${esc(label)}" style="--c:${color}"></button>`;
const toggle=(id,label,on)=>`<div class="mb-toggle"><span>${label}</span><button type="button" class="mb-switch" data-toggle="${id}" aria-pressed="${on}" aria-label="${label}"><i></i></button></div>`;
const sec=(title,body)=>`<section class="mb-sec"><h2 class="mb-h">${title}</h2>${body}</section>`;
function itemChips(slot,field,withNone){
 const list=items().filter(i=>i.slot===slot);
 return (withNone?gearChip(field,'none','Keine',cfg[field]==='none'):'')+list.map(i=>gearChip(field,i.value,i.name,cfg[field]===i.value,lockTag(i))).join('');
}
function colorRow(field,map,labels){return `<div class="mb-row">${Object.keys(map).map(k=>sw(field,k,map[k][0],labels[k]||k,cfg[field]===k)).join('')}</div>`}
function viewKoerper(){
 return sec('Hautfarbe',`<div class="mb-row">${H.TONES.map((t,i)=>sw('tone',i,t[0],'Hautton '+(i+1),cfg.tone===i)).join('')}</div>`)
  +sec('Frisur',`<div class="mb-row">${items().filter(i=>i.slot==='hair').map(i=>chip('hair',i.value,esc(i.name),cfg.hair===i.value,lockTag(i))).join('')}</div>`)
  +sec('Haarfarbe',colorRow('hc',H.HC,H.LABEL.hc))+sec('Augenfarbe',colorRow('eye',H.EYE,H.LABEL.eye));
}
function viewKleidung(){
 const gl=cfg.hands==='gloves';
 return sec('Kopf',`<div class="mb-row">${OPT.head.map(([v,l])=>gearChip('head',v,l,cfg.head===v)).join('')}</div>${cfg.head!=='none'?colorRow('headc',H.CL,H.LABEL.col):''}`)
  +sec('Oberteil',`<div class="mb-row">${OPT.top.map(([v,l])=>gearChip('top',v,l,cfg.top===v)).join('')}</div>${cfg.top!=='none'?colorRow('topc',H.CL,H.LABEL.col):''}${cfg.top==='hoodie'?toggle('hood','Kapuze auf',cfg.hood):''}`)
  +sec('Hose',`<div class="mb-row">${OPT.bottom.map(([v,l])=>gearChip('bottom',v,l,cfg.bottom===v)).join('')}</div>${colorRow('bottomc',H.CL,H.LABEL.col)}<p class="mb-note">Hose und Schuhe trägt dein Holo immer.</p>`)
  +sec('Hände',`<div class="mb-row">${OPT.hands.map(([v,l])=>gearChip('hands',v,l,cfg.hands===v)).join('')}</div>${gl?`<div class="mb-row">${itemChips('glove','glove',false)}</div>`:''}`)
  +sec('Schuhe',`<div class="mb-row">${OPT.feet.map(([v,l])=>gearChip('feet',v,l,cfg.feet===v)).join('')}</div>${colorRow('feetc',H.CL,H.LABEL.col)}`)
  +sec('Mantel',`${toggle('coat','Mantel tragen',cfg.coat!=='none')}<div class="mb-row">${items().filter(i=>i.slot==='coat').map(i=>gearChip('coatPick',i.value,i.name,(cfg.coat!=='none'?cfg.coat:coatChoice)===i.value,lockTag(i))).join('')}</div>`);
}
function viewExtras(){
 return `<p class="mb-note">Gesperrtes kannst du anprobieren. Freischalten über den Shop oder Belohnungen.</p>`
  +sec('Aura',`<div class="mb-row">${itemChips('aura','aura',true)}</div>`)
  +sec('Spezial-Augen',`<div class="mb-row">${itemChips('eyefx','eyefx',true)}</div>`)
  +sec('Hintergrund',`<div class="mb-row">${itemChips('scene','scene',false)}</div>`);
}
function poseRow(field){
 return `<div class="mb-row">${items().filter(i=>i.slot==='pose').map(i=>`<button type="button" class="mb-pose" data-set="${field}" data-val="${esc(i.value)}" aria-pressed="${cfg[field]===i.value}"><span class="mb-pose-fig">${H.svg(cfg,{pose:i.value,scene:'none',holo:false})}</span>${esc(i.name)}${lockTag(i)}</button>`).join('')}</div>`;
}
function viewPosen(){
 // Etappe 17b: so, wie andere die Karte sehen (öffentliche Werte, beste Karte = 92)
 const perf=data.perf,raw=perf&&perf.rating&&perf.rating.current?perf.rating.current.summary:null,r=raw?(P.pubOf(raw)||raw):null;
 const pos=perf&&perf.style&&perf.style.current?P.styleType(perf.style.current.scores).pos:'BOX';
 const cardHtml=P.card({name:data.display_name,overall:r?r.overall:70,categories:r?r.categories:{OFF:70,DEF:70,BEI:70,KON:70,TAK:70,MEN:70},pos,width:170,look:{holo:cfg}});
 return sec('Im Profil',poseRow('pose_profile'))+sec('Auf der FUT-Karte',poseRow('pose_card'))+sec('So sieht deine Karte aus',`<div class="mb-cardprev">${cardHtml}</div>`);
}
function viewShop(){
 if(!data.shop)return `<div class="tlp-panel">Der Kampfgeist-Shop ist noch nicht freigeschaltet. Anprobieren kannst du trotzdem.</div>`;
 const buyBtn=(kind,key,price,owned)=>owned?`<span class="mb-owned">Im Besitz</span>`
  :confirmBuy===kind+':'+key?`<span class="mb-confirm"><button type="button" class="mb-btn primary" data-buy-${kind}="${esc(key)}" data-confirm="1">Ja, für ${fmt(price)} kaufen</button><button type="button" class="mb-btn" data-cancel="1">Abbrechen</button></span>`
  :`<button type="button" class="mb-btn" data-buy-${kind}="${esc(key)}"${data.coins<price?' disabled':''}>${COIN}${fmt(price)}</button>`;
 const bundles=(data.bundles||[]).map(b=>{const its=b.items.map(k=>items().find(i=>i.key===k)).filter(Boolean);
  const look=Object.assign({},cfg);its.forEach(i=>{if(['coat','aura','eyefx','scene'].includes(i.slot))look[i.slot]=i.value;if(i.slot==='glove'){look.hands='gloves';look.glove=i.value}if(i.slot==='pose')look.pose_profile=i.value});
  return `<article class="mb-bundle"><span class="mb-bfig">${H.svg(look,{})}</span><div class="mb-bbody"><span class="mb-eyebrow">Bundle</span><b>${esc(b.name)}</b><p class="mb-note">${esc(b.description||'')}</p>
   <div class="mb-price">${COIN}${fmt(b.price)} <s>${fmt(b.value)}</s></div>${buyBtn('bundle',b.key,b.price,b.owned_all)}
   <button type="button" class="mb-btn ghost" data-try-bundle="${esc(b.key)}">Anprobieren</button></div></article>`}).join('');
 const shopItems=items().filter(i=>i.unlock==='shop');
 const groups=['coat','glove','aura','eyefx','scene','pose'].map(s=>{const l=shopItems.filter(i=>i.slot===s);return l.length?sec(SLOT_TITLE[s],`<div class="mb-list">${l.map(i=>`<div class="mb-li"><span class="mb-shop-item-art" aria-hidden="true">${(G&&G.supports(i.slot,i.value)?G.svg(i.slot,i.value,itemLook(i.slot,i.value)):H.svg(itemLook(i.slot,i.value),{pose:'guard',scene:i.slot==='scene'?i.value:'none',holo:false}))}</span><span><b>${esc(i.name)}</b><span class="mb-rar r-${esc(i.rarity)}">${esc(({common:'Gewöhnlich',rare:'Selten',epic:'Episch',leg:'Legendär',myth:'Mythisch'})[i.rarity]||'')}</span></span>${buyBtn('item',i.key,i.price,i.owned)}</div>`).join('')}</div>`):''}).join('');
 const rewards=items().filter(i=>i.unlock==='reward');
 return `<div class="mb-wallet">${COIN}<b>${fmt(data.coins)}</b> Coins</div>${bundles?sec('Bundles',`<div class="mb-bundles">${bundles}</div>`):''}${groups}`
  +sec('Belohnungen',`<div class="mb-list">${rewards.map(i=>`<div class="mb-li"><span><b>${esc(i.name)}</b><span class="mb-note">${esc(SLOT_TITLE[i.slot]||'')} · ${esc(i.reward||'')}</span></span>${i.owned?'<span class="mb-owned">Freigeschaltet</span>':'<span class="mb-lockedtxt">Noch gesperrt</span>'}</div>`).join('')}</div>`);
}
// Preserve the focused selection across the DOM rebuild caused by outfit edits.
// Match only our own fixed control attributes; never construct selectors from user data.
function editorFocusKey(el){
 if(!el||!app.contains(el))return null;
 const names=['data-set','data-val','data-tab','data-toggle','data-buy-item',
  'data-buy-bundle','data-confirm','data-cancel','data-try-bundle','id'];
 const values=names.filter(k=>el.hasAttribute(k)).map(k=>[k,el.getAttribute(k)]);
 return values.length?values:null;
}
function restoreEditorFocus(key){
 if(!key)return;
 const el=[...app.querySelectorAll('button')].find(btn=>
  key.every(([name,value])=>btn.getAttribute(name)===value));
 if(el&&!el.disabled)el.focus({preventScroll:true});
}
// Decorative navigation artwork for the approved navy/gold mobile design.
// Each tab retains its ordinary button semantics and accessible text label.
const tabIcon=d=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d+'</svg>';
const TAB_ICONS=Object.freeze({
 koerper:tabIcon('<circle cx="12" cy="5" r="2.7"/><path d="M8 21v-6l-3 2-2-2 4-6h10l4 6-2 2-3-2v6M9 9l3 3 3-3"/>'),
 kleidung:tabIcon('<path d="m9 3 3 2 3-2 6 4-2 5-3-1v10H8V11l-3 1-2-5 6-4Z"/>'),
 extras:tabIcon('<path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5L12 2Z"/><path d="M19 2v4M17 4h4"/>'),
 posen:tabIcon('<circle cx="11" cy="4.5" r="2"/><path d="m10 8 4 3 4-1 2 2-6 2-3-2-3 4-5 3m8-7 3 5 4 4"/>'),
 shop:tabIcon('<path d="M2 3h3l3 12h11l3-9H6"/><circle cx="10" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/>')
});
function render(){
 // Keep the vertical editor position and horizontal equipment carousel positions
 // when changing colors/items. Re-rendering must not jump back to the beginning.
 const focused=editorFocusKey(document.activeElement);
 const previousTab=app.querySelector('.mb-panel')?.dataset.activeTab;
 const previousScroll=app.querySelector('.mb-tabbody')?.scrollTop||0;
 const previousTabsScroll=app.querySelector('.mb-tabs')?.scrollLeft||0;
 const oldRows=[...app.querySelectorAll('.mb-sec')].map(sec=>({
  title:sec.querySelector('.mb-h')?.textContent,
  lefts:[...sec.querySelectorAll('.mb-row')].map(row=>row.scrollLeft)
 }));
 document.body.classList.add('mb-editor-ready');
 const tabs=[['koerper','Körper'],['kleidung','Kleidung'],['extras','Extras'],['posen','Posen'],['shop','Shop']];
 const tl=tryOn(),pose=previewPose==='card'?cfg.pose_card:cfg.pose_profile;
 app.innerHTML=`${data.preview?'<p class="tlp-note">Vorschau – für die Boxer sichtbar, sobald der Boxer-Holo freigeschaltet ist.</p>':''}
 <div class="mb-layout"><div class="mb-stage"><div class="mb-stage-heading"><span class="mb-stage-title"><small>TAKEOVER LEAGUE</small><strong>MEIN BOXER</strong></span><span class="mb-save-state" data-save-status="${busy?'busy':tl.length?'tryon':dirty()?'dirty':'saved'}">${busy?'Wird gespeichert …':tl.length?'Anprobe':dirty()?'Nicht gespeichert':'✓ Gespeichert'}</span><a href="./boxer.html" aria-label="Mein Studio öffnen">Studio</a></div>
 <div class="mb-arena" aria-hidden="true"><span class="mb-arena-light mb-arena-light--left"></span><span class="mb-arena-light mb-arena-light--right"></span><span class="mb-arena-flag mb-arena-flag--left"><b>♛</b><small>TAKEOVER</small></span><span class="mb-arena-flag mb-arena-flag--right"><b>♛</b><small>TAKEOVER</small></span><span class="mb-arena-rope"></span><span class="mb-arena-ring"></span></div>
 <div class="mb-preview">${heroArt(cfg,pose)}${artDebugLabel(cfg,pose)}</div>${referenceNotice()}${canCompareArt?`<button type="button" class="mb-art-compare" data-art-compare="1" aria-pressed="${compareSvg}" aria-label="Boxer-Grafik vergleichen">${compareSvg?'Premium anzeigen':'Mit SVG vergleichen'}</button>`:''}
  <div class="mb-stage-bar"><span class="mb-pill">${previewPose==='card'?'Karten-Pose':'Profil-Pose'}</span>${data.shop?`<span class="mb-pill">${COIN}${fmt(data.coins)}</span>`:''}</div>
  <div class="mb-actions"><button type="button" class="mb-btn primary" id="saveBtn"${!dirty()||tl.length||busy?' disabled':''}>${tl.length?'Gesperrtes zuerst kaufen oder abwählen':dirty()?'Speichern':'Gespeichert'}</button>${dirty()?'<button type="button" class="mb-btn ghost" id="resetBtn">Änderungen verwerfen</button>':''}</div></div>
 <div class="mb-panel" data-active-tab="${tab}"><div class="mb-tabs" role="tablist" aria-label="Bereiche">${tabs.map(([k,l])=>`<button type="button" role="tab" id="mb-tab-${k}" aria-controls="mb-tabbody" class="mb-tab" data-tab="${k}" aria-selected="${tab===k}" tabindex="${tab===k?0:-1}"><span class="mb-tab-icon">${TAB_ICONS[k]}</span><span class="mb-tab-label">${l}</span></button>`).join('')}</div>
  <div class="mb-tabbody" id="mb-tabbody" role="tabpanel" aria-labelledby="mb-tab-${tab}" tabindex="0">${tl.length?`<div class="mb-tryon" role="note"><b>Anprobe:</b> ${tl.map(esc).join(', ')}<button type="button" class="mb-btn" data-tab="shop">Zum Shop</button></div>`:''}${tab==='koerper'?viewKoerper():tab==='kleidung'?viewKleidung():tab==='extras'?viewExtras():tab==='posen'?viewPosen():viewShop()}</div></div></div>`;
 const tabsRail=app.querySelector('.mb-tabs');
 if(tabsRail)tabsRail.scrollLeft=previousTabsScroll;
 if(previousTab===tab){
  const content=app.querySelector('.mb-tabbody');
  if(content)content.scrollTop=previousScroll;
  for(const sec of app.querySelectorAll('.mb-sec')){
   const old=oldRows.find(x=>x.title===sec.querySelector('.mb-h')?.textContent);
   if(old)[...sec.querySelectorAll('.mb-row')].forEach((row,i)=>{row.scrollLeft=old.lefts[i]||0});
  }
 }
 restoreEditorFocus(focused);
}
async function load(){
 const [h,perf]=await Promise.all([db.rpc('get_my_holo'),db.rpc('get_my_performance')]);
 if(h.error)throw h.error;
 data=h.data;if(!data||!data.enabled)return;
 data.perf=perf.error?null:perf.data;
}
// If even one approved artwork file fails, redraw the complete SVG hero.
app.addEventListener('error',e=>{
 const img=e.target;
 if(!img||!img.matches||!img.matches('.mb-preview .mb-artpack-img'))return;
 if(A&&A.active.markFailed(img.getAttribute('src')))refreshHero();
},true);
// Roving tab focus: left/right arrows, Home and End mirror native tab controls.
app.addEventListener('keydown',e=>{
 const btn=e.target.closest('[role="tab"][data-tab]');
 if(!btn||!app.contains(btn))return;
 if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;
 const tabs=[...app.querySelectorAll('.mb-tabs [role="tab"]')];
 const i=tabs.indexOf(btn);
 if(i<0)return;
 e.preventDefault();
 const next=e.key==='Home'?0:e.key==='End'?tabs.length-1:
  (i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;
 tabs[next].click();
 const active=app.querySelector('.mb-tabs [role="tab"][aria-selected="true"]');
 if(active)active.focus({preventScroll:true});
});
// Reference image never leaves this browser, is not uploaded and never affects RPCs.
app.addEventListener('change',e=>{
 const picker=e.target.closest('#mb-reference-file');
 if(!picker||!referenceReview)return;
 const file=picker.files&&picker.files[0];
 if(!file)return;
 if(!['image/png','image/webp'].includes(file.type)||file.size>2*1024*1024){
  say('Nur PNG oder WebP bis 2 MiB erlaubt.',true);return;
 }
 const candidate=URL.createObjectURL(file);
 const img=new Image();
 img.onload=()=>{
  if(img.naturalWidth!==768||img.naturalHeight!==1216){
   URL.revokeObjectURL(candidate);
   say('Referenz muss 768 × 1216 Pixel gross sein.',true);return;
  }
  if(referenceSrc)URL.revokeObjectURL(referenceSrc);
  referenceSrc=candidate;referenceVisible=true;
  say('Anime-Referenz lokal geladen. Ausrüstung bleibt unverändert.');
  render();
 };
 img.onerror=()=>{
  URL.revokeObjectURL(candidate);
  say('Bild konnte nicht gelesen werden.',true);
 };
 img.src=candidate;
});
window.addEventListener('pagehide',()=>{if(referenceSrc)URL.revokeObjectURL(referenceSrc)});
app.addEventListener('click',async e=>{
 const reference=e.target.closest('[data-reference-toggle]');
 if(reference&&referenceReview&&referenceSrc){
  referenceVisible=!referenceVisible;
  render();
  app.querySelector('[data-reference-toggle]')?.focus({preventScroll:true});
  return;
 }
 const compare=e.target.closest('[data-art-compare]');
 if(compare&&canCompareArt){
  compareSvg=!compareSvg;
  compare.setAttribute('aria-pressed',String(compareSvg));
  compare.textContent=compareSvg?'Premium anzeigen':'Mit SVG vergleichen';
  refreshHero();
  return;
 }
 const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;confirmBuy=null;render();if(t.closest('.mb-tryon'))app.querySelector('.mb-tabbody')?.scrollTo({top:0,behavior:'smooth'});return}
 const s=e.target.closest('[data-set]');
 if(s){referenceVisible=false;const f=s.dataset.set,v=s.dataset.val;
  if(f==='tone')cfg.tone=Number(v);
  else if(f==='coatPick'){coatChoice=v;cfg.coat=v}
  else{cfg[f]=v;if(f==='pose_card')previewPose='card';if(f==='pose_profile')previewPose='profile';if(f==='top'&&v!=='hoodie')cfg.hood=false}
  render();return}
 const g=e.target.closest('[data-toggle]');
 if(g){referenceVisible=false;if(g.dataset.toggle==='hood')cfg.hood=!cfg.hood;else{if(cfg.coat!=='none'){coatChoice=cfg.coat;cfg.coat='none'}else cfg.coat=coatChoice}render();return}
 const tb=e.target.closest('[data-try-bundle]');
 if(tb){referenceVisible=false;const b=data.bundles.find(x=>x.key===tb.dataset.tryBundle);if(b)b.items.forEach(k=>{const i=items().find(x=>x.key===k);if(!i)return;if(['coat','aura','eyefx','scene'].includes(i.slot))cfg[i.slot]=i.value;if(i.slot==='glove'){cfg.hands='gloves';cfg.glove=i.value}if(i.slot==='pose')cfg.pose_profile=i.value});
  render();app.querySelector('.mb-tabbody')?.scrollTo({top:0,behavior:'smooth'});return}
 if(e.target.closest('[data-cancel]')){confirmBuy=null;render();return}
 const bi=e.target.closest('[data-buy-item],[data-buy-bundle]');
 if(bi){
  const kind=bi.dataset.buyItem?'item':'bundle',key=bi.dataset.buyItem||bi.dataset.buyBundle;
  if(busy)return;
  if(!bi.dataset.confirm){confirmBuy=kind+':'+key;render();return}
  busy=true;say('Kauf läuft …');
  try{
   const {data:res,error}=kind==='item'
    ?await db.rpc('buy_holo_item',{p_key:key})
    :await db.rpc('buy_holo_bundle',{p_key:key});
   if(error)throw error;
   if(!res)throw Error('Keine Kaufbestätigung erhalten.');
   // A successful purchase must not look unsuccessful just because the subsequent
   // refresh fails. Never auto-repeat a transaction.
   const keep=cfg;
   if(data&&Number.isFinite(Number(res.balance)))data.coins=Number(res.balance);
   try{
    await load();cfg=keep;
    say(`Gekauft: ${res.name}. Neuer Stand: ${fmt(res.balance)} Coins.`);
   }catch(e){
    cfg=keep;
    say('Kauf bestätigt. Kontostand konnte nicht aktualisiert werden – bitte Seite später neu laden.',true);
   }
  }catch(e){
   say('Kauf fehlgeschlagen: '+(e.message||e),true);
  }finally{
   busy=false;confirmBuy=null;render();
  }
  return;
 }
 if(e.target.closest('#resetBtn')){
  if(busy)return;
  cfg=JSON.parse(saved);say('Änderungen verworfen.');render();return;
 }
 if(e.target.closest('#saveBtn')){
  if(busy)return;
  const snapshot=JSON.stringify(cfg);
  busy=true;render();
  try{
   // Send an immutable snapshot; later colour or outfit changes must not be lost.
   const {data:res,error}=await db.rpc('save_my_holo',{p_config:JSON.parse(snapshot)});
   if(error)throw error;
   if(!res)throw Error('Keine Speicherbestätigung erhalten.');
   const result=H.normalize(res);
   saved=JSON.stringify(result);
   if(JSON.stringify(cfg)===snapshot){
    cfg=result;
    say('Gespeichert. So sehen dich jetzt alle im Profil und auf deiner Karte.');
   }else{
    say('Gespeichert. Deine neueren Änderungen sind noch nicht gespeichert.');
   }
  }catch(e){
   say('Speichern fehlgeschlagen: '+(e.message||e),true);
  }finally{
   busy=false;render();
  }
  return;
 }
});
try{
 db=await P.client();
 const s=await db.auth.getSession();
 if(!s.data||!s.data.session){say('');app.innerHTML='<div class="tlp-panel">Bitte <a href="./login.html">anmelden</a>, um deinen Boxer zu gestalten.</div>'}
 else{
  await load();
  if(!data||!data.enabled){say('');app.innerHTML='<div class="tlp-panel">Der Boxer-Holo ist noch nicht freigeschaltet.</div>'}
  else{cfg=H.normalize(data.config);saved=JSON.stringify(cfg);coatChoice=cfg.coat!=='none'?cfg.coat:'basic';
   const want=new URLSearchParams(location.search).get('tab');if(['koerper','kleidung','extras','posen','shop'].includes(want))tab=want;
   say('');render()}
 }
}catch(e){say('Mein Boxer konnte nicht geladen werden: '+(e.message||e),true)}
</script>
