<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hijab · gemeinsames Master</title><style>*{box-sizing:border-box}body{margin:20px;background:#172337;color:#eee;font:16px system-ui}main{max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}figure{margin:0;padding:14px;background:#26374b;border-radius:10px}canvas{width:100%;height:auto}.detail{max-height:330px;object-fit:contain}#item{max-width:200px}@media(max-width:600px){body{margin:12px}.grid{grid-template-columns:1fr}}</style><main><h1>Hijab · Cool / Guard</h1><p>Ein gemeinsames Stoff-Master. Schwarz, ohne Mantel/Oberteil/Kapuze. Haare vollständig verborgen. Künstlerische Abnahme offen, Premium deaktiviert.</p><div class="grid" id="grid"></div><h2>Exakte Item-Quelle</h2><canvas id="item"></canvas><p id="status">Laden…</p></main><script src="../../../takeover-holo.js"></script><script src="../pilot.js"></script><script src="hijab.js"></script><script>
(async()=>{const [m,a]=await Promise.all([fetch('manifest.json').then(r=>r.json()),fetch('../pilot-assets.json').then(r=>r.json())]),cache=new Map();async function image(src){if(!cache.has(src))cache.set(src,(async()=>{const im=new Image();im.src='../'+src;await im.decode();return im})());return cache.get(src)}const p=m.pieces[0],im=await image(p.src),imgs={[p.src]:im};window.hijabManifest=m;window.hijabConfig=pose=>TLHolo.normalize({pose_profile:pose,tone:6,hair:'afro',hc:'schwarz',eye:'braun',head:'hijab',headc:'schwarz',top:'none',hood:false,bottom:'boxer',bottomc:'schwarz',hands:'gloves',glove:'schwarzgold',feet:'boots',feetc:'schwarz',coat:'none',aura:'none',eyefx:'none',scene:'holo'});
for(const pose of m.poses)for(const before of [true,false]){const cfg=hijabConfig(pose),s=TLPremiumHijab.resolve(cfg,m),base=TLPremiumV2Pilot.resolve({...cfg,head:'none'},a),c=document.createElement('canvas');c.width=768;c.height=1216;c.dataset.pose=pose;c.dataset.before=before;const g=c.getContext('2d');for(const part of base.v1){if(!before&&(!TLPremiumHijab.includeLayer(part.slot,s)||part.slot==='hands'))continue;const source=await image(part.src);g.drawImage(!before&&part.slot==='body'?TLPremiumHijab.maskBody(source,s):source,0,0)}if(!before){TLPremiumHijab.draw(g,s,imgs);for(const part of base.v1)if(part.slot==='hands')g.drawImage(await image(part.src),0,0)}const f=document.createElement('figure'),title=document.createElement('figcaption'),detail=document.createElement('canvas');detail.width=240;detail.height=290;detail.className='detail';detail.getContext('2d').drawImage(c,265,30,240,290,0,0,240,290);title.textContent=pose+' · '+(before?'Vorher: Afro':'Nachher: Hijab');f.append(title,detail,c);document.getElementById('grid').append(f)}const item=document.getElementById('item');item.width=p.uv[2];item.height=p.uv[3];item.getContext('2d').drawImage(im,...p.uv,0,0,item.width,item.height);document.getElementById('status').textContent='1 Quelle · 2 Posen · alle Haarformen vollständig ausgeblendet';document.body.dataset.ready='true';})().catch(e=>{document.getElementById('status').textContent=e.message;document.body.dataset.ready='error'});
</script></html>
