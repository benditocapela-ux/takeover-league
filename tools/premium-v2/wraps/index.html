<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bandagen · Prüfansicht</title><style>*{box-sizing:border-box}body{background:#172337;color:#eee;font:16px system-ui;margin:20px}main{max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0;background:#26374b;padding:15px;border-radius:10px}canvas{width:100%;height:auto}.detail{max-height:350px;object-fit:contain}p{line-height:1.5}@media(max-width:600px){body{margin:12px}.grid{grid-template-columns:1fr}}</style><main><h1>Bandagen · Cool / Guard</h1><p>Neue echte Handgrafiken. Künstlerische Abnahme offen, Premium deaktiviert. Vorher: bestehende Handschuhe. Nachher: weisse Baumwollbandagen. Keine Freigabe.</p><div class="grid" id="grid"></div><h2>Quellen · dieselben Ausschnitte wie an der Figur</h2><div class="grid" id="items"></div><p id="status">Laden…</p></main><script src="../../../takeover-holo.js"></script><script src="../pilot.js"></script><script>
(async()=>{const [m,a]=await Promise.all([fetch('manifest.json').then(r=>r.json()),fetch('../pilot-assets.json').then(r=>r.json())]),cache=new Map();async function image(src){if(!cache.has(src))cache.set(src,(async()=>{const im=new Image();im.src='../'+src;await im.decode();return im})());return cache.get(src)}
for(const pose of m.poses)for(const before of [true,false]){const c=document.createElement('canvas');c.width=768;c.height=1216;c.dataset.pose=pose;c.dataset.before=before;const g=c.getContext('2d'),cfg={pose_profile:pose,tone:6,hair:'kurz_glatt',hc:'schwarz',eye:'braun',head:'none',top:'none',topc:'schwarz',hood:false,bottom:'boxer',bottomc:'schwarz',hands:'gloves',glove:'schwarzgold',feet:'boots',feetc:'schwarz',coat:'none',aura:'none',eyefx:'none',scene:'holo'},base=TLPremiumV2Pilot.resolve(cfg,a);if(!base)throw Error('Base unavailable');for(const p of base.v1){if(!before&&p.slot==='hands')continue;g.drawImage(await image(p.src),0,0)}if(!before)for(const p of Object.values(m.pieces).filter(p=>p.pose===pose))g.drawImage(await image(p.src),...p.uv,...p.box);const f=document.createElement('figure'),title=document.createElement('figcaption'),detail=document.createElement('canvas');detail.width=390;detail.height=350;detail.className='detail';detail.getContext('2d').drawImage(c,190,140,390,350,0,0,390,350);title.textContent=pose+' · '+(before?'Vorher: Handschuhe':'Nachher: Bandagen · Abnahme offen');f.append(title,detail,c);document.getElementById('grid').append(f)}
for(const p of Object.values(m.pieces)){const f=document.createElement('figure'),t=document.createElement('figcaption'),c=document.createElement('canvas');t.textContent=p.id;c.width=p.uv[2];c.height=p.uv[3];c.className='detail';c.dataset.source=p.src;c.getContext('2d').drawImage(await image(p.src),...p.uv,0,0,c.width,c.height);f.append(t,c);document.getElementById('items').append(f)}window.wrapsManifest=m;document.getElementById('status').textContent='2 Paar-Master · 4 registrierte Handteile · keine Freigabe';document.body.dataset.ready='true';})().catch(e=>{document.getElementById('status').textContent=e.message;document.body.dataset.ready='error'});
</script></html>
