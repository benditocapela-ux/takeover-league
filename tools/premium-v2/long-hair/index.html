<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Locs · zwei Ebenen</title><style>*{box-sizing:border-box}body{margin:20px;background:#172337;color:#eee;font:16px system-ui}main{max-width:1200px;margin:auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}figure{margin:0;padding:10px;background:#2a3a50;border-radius:8px}canvas{width:100%;height:auto}.details{max-height:320px;object-fit:contain}#sources{max-width:500px}@media(max-width:700px){body{margin:12px}.grid{grid-template-columns:1fr 1fr}}</style><main><h1>Locs · gemeinsames Front/Back-Master</h1><p>Gleiche zwei Ebenen für Cool und Guard. Acht Haarfarben, keine Freigabe. Ohne Kopfbedeckung, Kapuze und Mantel.</p><div class="grid" id="grid"></div><h2>Originalquellen / Atlas</h2><canvas id="sources"></canvas><p id="status">Laden…</p></main><script src="../../../takeover-holo.js"></script><script src="../pilot.js"></script><script src="../materials.js"></script><script src="long-hair.js"></script><script>
(async()=>{const [m,a]=await Promise.all([fetch('manifest.json').then(r=>r.json()),fetch('../pilot-assets.json').then(r=>r.json())]),cache=new Map();async function image(src){if(!cache.has(src))cache.set(src,(async()=>{const im=new Image();im.src='../'+src;await im.decode();return im})());return cache.get(src)}const family=new URLSearchParams(location.search).get('family')||'locs';m.pieces=m.pieces.filter(p=>m.families[family].pieces.includes(p.id));document.querySelector('h1').textContent=family+' · gemeinsames Front/Back-Master';const src=m.pieces[0].src,im=await image(src),images={[src]:im};window.longHairManifest=m;window.longHairConfig=(pose,hc='schwarz')=>TLHolo.normalize({pose_profile:pose,tone:6,hair:family,hc,eye:'braun',head:'none',top:'none',hood:false,bottom:'boxer',bottomc:'schwarz',hands:'gloves',glove:'schwarzgold',feet:'boots',feetc:'schwarz',coat:'none',aura:'none',eyefx:'none',scene:'holo'});
for(const pose of m.poses)for(const color of ['before',...m.colors]){const cfg=longHairConfig(pose,color==='before'?'schwarz':color),s=TLPremiumLongHair.resolve(cfg,m),base=TLPremiumV2Pilot.resolve({...cfg,hair:'kurz_glatt',hc:'schwarz'},a),c=document.createElement('canvas');c.width=768;c.height=1216;c.dataset.pose=pose;c.dataset.color=color;const g=c.getContext('2d');if(color!=='before')TLPremiumLongHair.draw(g,s,images,'back');for(const p of base.v1){if(p.slot==='hair'&&color!=='before'||p.slot==='hands')continue;g.drawImage(await image(p.src),0,0)}if(color!=='before')TLPremiumLongHair.draw(g,s,images,'front');for(const p of base.v1)if(p.slot==='hands')g.drawImage(await image(p.src),0,0);const f=document.createElement('figure'),t=document.createElement('figcaption'),detail=document.createElement('canvas');detail.width=270;detail.height=330;detail.className='details';detail.getContext('2d').drawImage(c,250,20,270,330,0,0,270,330);t.textContent=pose+' · '+color;f.append(t,detail,c);document.getElementById('grid').append(f)}const cv=document.getElementById('sources');cv.width=im.width;cv.height=im.height;cv.getContext('2d').drawImage(im,0,0);document.getElementById('status').textContent='1 Atlas · 2 Ebenen · 2 Posen × 8 Farben · künstlerisch offen';document.body.dataset.ready='true';})().catch(e=>{document.getElementById('status').textContent=e.message;document.body.dataset.ready='error'});
</script></html>
