(async()=>{const a=await(await fetch('pilot-assets.json')).json(),mode=new URLSearchParams(location.search).get('mode')==='v1'?'v1':'v2';const c=TLHolo.normalize({tone:6,hair:'afro',hc:'schwarz',eye:'braun',head:'none',top:'none',bottom:'boxer',bottomc:'schwarz',hands:'gloves',glove:'schwarzgold',feet:'boots',feetc:'schwarz',coat:'samurai',aura:'none',eyefx:'none',scene:'holo',pose_profile:'guard'});const selection=TLPremiumV2Pilot.resolve(c,a),start=performance.now(),images=await TLPremiumV2Pilot.prepare(selection,mode);await Promise.all(Object.values(images).map(i=>i.decode()));TLPremiumV2Pilot.draw(document.querySelector('canvas').getContext('2d'),selection,images,mode);document.querySelector('canvas').getContext('2d').getImageData(0,0,1,1);const imageURLs=new Set(Object.keys(images).map(s=>new URL(s,location.href).href));window.result={mode,loadDecodeFirstDrawMs:performance.now()-start,imageRequests:imageURLs.size,imageEncodedBytes:performance.getEntriesByType('resource').filter(r=>imageURLs.has(r.name)).reduce((n,r)=>n+r.encodedBodySize,0),decodedRGBABytes:Object.values(images).reduce((n,i)=>n+i.naturalWidth*i.naturalHeight*4,0)};document.body.dataset.ready='true'})().catch(e=>{window.error=e.message;document.body.dataset.ready='error'});
