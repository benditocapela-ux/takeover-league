<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gym-Check-in · Takeover League</title>
<style>:root{color-scheme:dark;font:16px system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;padding:var(--sp-5) var(--sp-4) 110px;background:var(--bg);color:var(--text)}main{max-width:820px;margin:auto}h1{color:var(--gold)}a{color:var(--gold)}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:3px}</style>
<link rel="stylesheet" href="./takeover-navigation.css"><link rel="stylesheet" href="./takeover-theme.css"><link rel="stylesheet" href="./takeover-redesign.css"></head><body data-tl-screen="checkin">
<main><div class="tl-screen-ribbon" aria-label="Aktueller Bereich: Gym-Check-in"><div class="tl-screen-identity"><span class="tl-screen-symbol" aria-hidden="true">✅</span><div><div class="tl-screen-eyebrow">TAKEOVER LEAGUE · Training im Gym</div><div class="tl-screen-title">Gym-Check-in</div></div></div><div class="tl-screen-links"><a href="./checkin.html" class="tl-screen-primary">Check-in</a><a href="./praesenz.html">Präsenz</a><a href="./wochenplan.html">Wochenplan</a></div></div>
<p class="tl-subnav"><a href="./boxer.html">← Mein Studio</a></p>
<h1 id="pageTitle">Gym-Check-in</h1>
<p id="status" class="tlp-status" role="status">Wird geladen …</p>
<div id="app"></div>
</main>
<script src="./takeover-performance.js" defer></script>
<script type="module">
const P=window.TLPerf,$=id=>document.getElementById(id),app=$('app'),status=$('status');
const say=(t,err)=>{status.textContent=t;status.classList.toggle('error',!!err);status.hidden=!t};
let db,role,types=[],groups=[],sessions=[],current=null,filter='alle',busy=false,cancelArmed=false,form={type:null,min:90,note:'',group:''},sched=null,unifiedScheduleActive=false;
const tierPill=s=>s&&s.club_tier?`<span class="tlp-pill inl ${s.club_tier==='pflicht'?'gold':'ok'}">${P.esc(s.tier_label||'')}</span>`:'';
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Zurich'}).format(new Date());
function boxerView(list,enabled){
 // Scheduled Pflicht units use the same unified one-tap RPC displayed above.
 // Keep additional, non-Pflicht Gym sessions available through the legacy flow.
 if(unifiedScheduleActive){
  const pflicht=list.filter(s=>s.club_tier==='pflicht');
  // With multiple open sessions, keep the detailed Gym choices visible.
  list=list.filter(s=>s.club_tier!=='pflicht'||pflicht.length>1);
  if(!list.length)return '';
 }
 if(!enabled)return '<div class="tlp-panel">Der Gym-Check-in ist noch nicht freigeschaltet.</div>';
 if(!list.length)return `<div class="tlp-panel"><b>Gerade läuft keine Einheit.</b><p class="tlp-note">Sobald dein Coach das Training im Gym startet, kannst du dich hier einchecken.</p></div>`;
 return list.map(s=>`<div class="tlp-panel tlp-session"><div class="tlp-eyebrow">Heute${s.group?' · '+P.esc(s.group):''}</div><h2 class="tlp-h2">${P.esc(s.training_type)} ${tierPill(s)}</h2><p class="tlp-note">${s.duration_minutes} Min. · ${P.esc(s.note)}</p>
  ${s.checked_in?'<div class="tlp-pill ok big">Eingecheckt ✓</div><p class="tlp-note">Dein Coach bestätigt nach dem Training alle Anwesenden auf einmal.</p>':`<button type="button" class="tlp-btn" data-checkin="${s.id}">Jetzt einchecken</button>`}</div>`).join('');
}
function todaySlots(){
 if(!sched||!sched.enabled)return '';
 const list=(sched.slots||[]).filter(x=>x.is_active&&x.dow===sched.today_dow);
 if(!list.length)return `<div class="tlp-panel"><b>Heute steht keine Vereinseinheit im Stundenplan.</b><p class="tlp-note">Du kannst unten trotzdem eine Einheit starten.</p></div>`;
 return `<div class="tlp-panel"><div class="tlp-eyebrow">Heute laut Stundenplan</div>${list.map(x=>`<div class="tlp-row spread"><span class="tlp-grow"><b>${P.esc(x.label)}</b> ${tierPill({club_tier:x.tier,tier_label:x.tier_label})}<span class="tlp-note">${P.esc(x.training_type)} · ${x.duration_minutes} Min.</span></span>${x.today_session?`<button type="button" class="tlp-btn small" data-show="${x.today_session.id}">${x.today_session.status==='open'?'Öffnen':'Ansehen'}</button>`:`<button type="button" class="tlp-btn" data-slot="${x.id}" ${busy?'disabled':''}>Starten</button>`}</div>`).join('')}</div>`;
}
function editPanel(s){
 if(!s.editable)return '';
 const opts=types.filter(t=>t.name!=='Joggen').map(t=>`<option value="${t.id}" ${String(t.id)===String(s.training_type_id)?'selected':''}>${P.esc(t.name)}</option>`).join('');
 const tiers=[['none','Keine Stufe (Wert der Trainingsart)']].concat(((sched&&sched.tiers)||[]).map(t=>[t.tier,t.label+' · '+t.exp+' EXP']));
 return `<details class="tlp-panel tlp-form"><summary><b>Einheit ändern</b> <span class="tlp-note">Trainingsart oder Stufe${s.status==='confirmed'?' – Punkte, EXP, Coins und Kampfpfad aller Anwesenden werden nachgeführt':''}</span></summary>
  <label class="tlp-field" for="edType">Trainingsart<select id="edType">${opts}</select></label>
  <label class="tlp-field" for="edTier">Stufe<select id="edTier">${tiers.map(([k,l])=>`<option value="${k}" ${(s.club_tier||'none')===k?'selected':''}>${P.esc(l)}</option>`).join('')}</select></label>
  <button type="button" class="tlp-btn" data-act="edit" ${busy?'disabled':''}>Änderung speichern</button></details>`;
}
function openForm(){
 const opts=types.filter(t=>t.name!=='Joggen').map(t=>`<option value="${t.id}" ${String(t.id)===String(form.type)?'selected':''}>${P.esc(t.name)}</option>`).join('');
 return todaySlots()+`<div class="tlp-panel tlp-form"><h2 class="tlp-h2">${sched&&sched.enabled&&(sched.slots||[]).some(x=>x.is_active&&x.dow===sched.today_dow)?'Andere Einheit starten':'Einheit starten'}</h2>
  <label class="tlp-field" for="ciType">Trainingsart<select id="ciType">${opts}</select></label>
  <div class="tlp-field">Dauer (Minuten)<div class="tlp-chips">${[60,75,90,120].map(m=>`<button type="button" class="tlp-chipbtn" aria-pressed="${form.min===m}" data-min="${m}">${m}</button>`).join('')}</div><input id="ciMin" type="number" min="1" max="1440" value="${form.min}" aria-label="Minuten"></div>
  <label class="tlp-field" for="ciNote">Bemerkung für alle <span class="tlp-note">Pflicht, mindestens 3 Zeichen</span><textarea id="ciNote" rows="2" maxlength="500" placeholder="z. B. Konter nach Jab, 4 Runden Sparring">${P.esc(form.note)}</textarea></label>
  <label class="tlp-field" for="ciGroup">Gruppe (optional)<select id="ciGroup"><option value="">Alle Gruppen</option>${groups.map(g=>`<option value="${g.key}" ${form.group===g.key?'selected':''}>${P.esc(g.name)}</option>`).join('')}</select></label>
  <button type="button" class="tlp-btn" data-act="open" ${busy?'disabled':''}>Einheit starten</button></div>`;
}
function sessionView(s){
 const people=s.people.filter(p=>filter==='alle'||p.group===filter||p.present),n=s.people.filter(p=>p.present).length,open=s.status==='open';
 return `<div class="tlp-panel tlp-row spread"><div><div class="tlp-eyebrow">${open?'Läuft · heute':s.status==='confirmed'?'Bestätigt':'Abgebrochen'}${s.group?' · '+P.esc((groups.find(g=>g.key===s.group)||{}).name||s.group):''}</div><h2 class="tlp-h2">${P.esc(s.training_type)} ${tierPill(s)}</h2><span class="tlp-note">${s.duration_minutes} Min. · ${P.esc(s.note)}</span></div><div class="tlp-count"><b>${n}</b><span>da</span></div></div>
  <div class="tlp-chips" role="group" aria-label="Gruppe">${[['alle','Alle']].concat(groups.map(g=>[g.key,g.name])).map(([k,l])=>`<button type="button" class="tlp-chipbtn" aria-pressed="${filter===k}" data-filter="${k}">${P.esc(l)}</button>`).join('')}</div>
  <p class="tlp-note">${open?'Tippe an, wer da ist. Wer sich selbst eingecheckt hat, ist schon markiert.':'Diese Einheit ist abgeschlossen.'}</p>
  <div class="tlp-cigrid">${people.map(p=>`<button type="button" class="tlp-cicell${p.present?' on':''}${p.confirmed?' ok':''}" aria-pressed="${p.present}" data-person="${p.id}" ${open?'':'disabled'}><span class="tlp-face sm">${P.esc(P.initials(p.display_name))}</span><b>${P.esc(p.display_name)}</b><span>${p.confirmed?'bestätigt'+(p.points!=null?' · '+p.points+' EXP':''):p.skipped_reason?P.esc(p.skipped_reason):p.present?(p.source==='self'?'selbst eingecheckt':'anwesend'):'nicht da'}</span></button>`).join('')}</div>
  ${open?`<button type="button" class="tlp-btn big" data-act="confirm" ${n&&!busy?'':'disabled'}>Alle ${n} Anwesenden bestätigen</button>
   <p class="tlp-note">Jeder Eintrag gilt als «vom Trainer eingetragen» und ist sofort bestätigt, mit Punkten und EXP wie immer. Dein eigenes Training und Trainings, die jemand schon selbst eingereicht hat, werden übersprungen.</p>
   <button type="button" class="tlp-btn ghost" data-act="cancel">${cancelArmed?'Nochmal tippen: Einheit abbrechen':'Einheit abbrechen'}</button>`:'<button type="button" class="tlp-btn" data-act="new">Neue Einheit starten</button>'}`;
}
function recentView(){
 if(!sessions.length)return '';
 return `<div class="tlp-panel"><b>Letzte Einheiten</b><div class="tlp-list">${sessions.map(s=>`<button type="button" class="tlp-li" data-show="${s.id}"><span class="tlp-grow"><b>${P.esc(s.training_type)} · ${P.fmtDate(s.session_date)}${s.tier_label?' · '+P.esc(s.tier_label):''}</b><span class="tlp-note">${s.status==='open'?'läuft':s.status==='confirmed'?s.confirmed+' bestätigt':'abgebrochen'} · ${s.present} anwesend · ${P.esc(s.opened_by||'')}</span></span><span aria-hidden="true">›</span></button>`).join('')}</div></div>`;
}
async function render(){
 if(role==='admin'||role==='coach'){
  app.innerHTML=(current?sessionView(current)+editPanel(current):openForm())+recentView();
 }
}
async function loadStaff(keepCurrent){
 const [s,t,g,c]=await Promise.all([db.rpc('staff_list_gym_sessions',{p_days:14}),types.length?{data:types}:db.from('training_types').select('id,name,is_active').eq('is_active',true),groups.length?{data:groups}:db.rpc('list_training_groups'),db.rpc('get_club_schedule')]);
 if(s.error||t.error||g.error){say((s.error||t.error||g.error).message,true);return}
 sched=c.error?null:c.data;
 sessions=s.data||[];types=(t.data||[]).slice().sort((a,b)=>a.name.localeCompare(b.name,'de'));groups=g.data||[];
 if(form.type===null){const reg=types.find(x=>x.name==='Reguläres Boxtraining')||types[0];form.type=reg?reg.id:null}
 let id=keepCurrent&&current?current.id:null;
 if(!id){const live=sessions.find(x=>x.status==='open'&&x.session_date===today());id=live?live.id:null}
 if(id){const r=await db.rpc('staff_get_gym_session',{p_session_id:id});if(r.error){say(r.error.message,true);return}current=r.data}else current=null;
 render();
}
async function loadBoxer(){
 const [list,pres]=await Promise.all([db.rpc('my_gym_sessions_today'),db.rpc('get_my_presence')]);
 if(list.error||pres.error){say((list.error||pres.error).message,true);return}
 app.innerHTML=boxerView(list.data||[],!!(pres.data&&pres.data.enabled));
}
app.addEventListener('click',async ev=>{
 const b=ev.target.closest('button');if(!b)return;
 if(b.dataset.checkin){b.disabled=true;const r=await db.rpc('gym_check_in',{p_session_id:Number(b.dataset.checkin)});if(r.error){say(r.error.message,true);b.disabled=false;return}say('Eingecheckt!');await loadBoxer();return}
 if(b.dataset.min){form.min=Number(b.dataset.min);form.note=$('ciNote').value;form.type=$('ciType').value;form.group=$('ciGroup').value;render();return}
 if(b.dataset.filter){filter=b.dataset.filter;render();return}
 if(b.dataset.slot&&!busy){busy=true;b.disabled=true;
  const r=await db.rpc('staff_open_club_session',{p_slot_id:Number(b.dataset.slot)});busy=false;
  if(r.error){say(r.error.message,true);b.disabled=false;return}
  say(r.data.existing?'Diese Einheit läuft schon.':'Einheit gestartet'+(r.data.tier_label?' ('+r.data.tier_label+')':'')+'. Boxer können sich jetzt einchecken.');current={id:r.data.id};await loadStaff(true);return}
 if(b.dataset.show){const r=await db.rpc('staff_get_gym_session',{p_session_id:Number(b.dataset.show)});if(r.error){say(r.error.message,true);return}current=r.data;render();window.scrollTo(0,0);return}
 if(b.dataset.person&&current&&current.status==='open'){
  const p=current.people.find(x=>x.id===b.dataset.person);if(!p)return;
  p.present=!p.present;p.source=p.present?'coach':null;render();
  const r=await db.rpc('staff_set_gym_attendance',{p_session_id:current.id,p_profile_id:p.id,p_present:p.present});
  if(r.error){p.present=!p.present;say(r.error.message,true);render()}
  return}
 const a=b.dataset.act;
 if(a==='open'&&!busy){
  form.type=$('ciType').value;form.min=Number($('ciMin').value);form.note=$('ciNote').value.trim();form.group=$('ciGroup').value;
  if(form.note.length<3){say('Bitte eine Bemerkung für alle angeben (mindestens 3 Zeichen).',true);return}
  busy=true;b.disabled=true;
  const r=await db.rpc('staff_open_gym_session',{p_training_type_id:Number(form.type),p_duration_minutes:form.min,p_note:form.note,p_group_key:form.group||null});
  busy=false;if(r.error){say(r.error.message,true);b.disabled=false;return}
  say('Einheit gestartet. Boxer können sich jetzt einchecken.');current={id:r.data.id};await loadStaff(true);return}
 if(a==='edit'&&!busy&&current){
  busy=true;b.disabled=true;
  const r=await db.rpc('staff_update_gym_session',{p_session_id:current.id,p_training_type_id:Number($('edType').value),p_tier:$('edTier').value});
  busy=false;if(r.error){say(r.error.message,true);b.disabled=false;return}
  say(r.data.updated_trainings?`Geändert: ${r.data.updated_trainings} Trainings nachgeführt · Punkte ${r.data.points_before} → ${r.data.points_after}`:'Einheit geändert.');
  await loadStaff(true);return}
 if(a==='confirm'&&!busy){
  busy=true;b.disabled=true;
  const r=await db.rpc('staff_confirm_gym_session',{p_session_id:current.id});
  busy=false;if(r.error){say(r.error.message,true);b.disabled=false;return}
  const sk=(r.data.skipped||[]).map(x=>x.name+' ('+x.reason+')').join(', ');
  say(`${r.data.confirmed} Trainings bestätigt${current&&current.tier_label?' als '+current.tier_label:''} · ${r.data.points_awarded} Punkte vergeben${sk?' · übersprungen: '+sk:''}`);
  await loadStaff(true);return}
 if(a==='cancel'){
  if(!cancelArmed){cancelArmed=true;render();setTimeout(()=>{cancelArmed=false;render()},4000);return}
  cancelArmed=false;const r=await db.rpc('staff_cancel_gym_session',{p_session_id:current.id});if(r.error){say(r.error.message,true);return}
  say('Einheit abgebrochen.');current=null;await loadStaff(false);return}
 if(a==='new'){current=null;render();return}
});
app.addEventListener('change',ev=>{if(ev.target.id==='ciMin')form.min=Number(ev.target.value)});
(async()=>{
 try{
  db=await P.client();
  const s=await db.auth.getSession();
  if(!s.data||!s.data.session){say('');app.innerHTML='<div class="tlp-panel">Bitte <a href="./login.html">anmelden</a>.</div>';return}
  const me=await db.rpc('get_my_performance');if(me.error){say(me.error.message,true);return}
  role=me.data.profile.role;say('');
  if(role==='admin'||role==='coach'){$('pageTitle').textContent='Gym-Check-in';await loadStaff(false)}else{
   $('pageTitle').textContent='Vereinstraining & Check-in';
   await loadBoxer();
   try{
    const config=await db.rpc('get_training_v2_config');
    if(!config.error&&config.data?.enabled===true){
     const quick=await import('./takeover-club-today.js');
     quick.mountCheckinSchedule({db,cfg:config.data,role});
     unifiedScheduleActive=true;
     await loadBoxer();
    }
   }catch(err){console.warn('Vereinsstundenplan nicht verfügbar:',err)}
  }
 }catch(e){say('Check-in konnte nicht geladen werden: '+(e.message||e),true)}
})();
</script>
<script src="./takeover-navigation.js" defer></script></body></html>
