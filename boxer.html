<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Training · Takeover League</title><style>:root{font-family:Inter,system-ui,Arial,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1422;color:#f5f5f6;padding:22px}main{max-width:760px;margin:auto}.brand{color:#dfbd77;font-weight:800;letter-spacing:2px}header,.bar,.line{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}a{color:#dfbd77}h1{margin-top:30px}.card{background:#142238;border:1px solid #314058;border-radius:16px;padding:22px;margin:20px 0}.muted{color:#b6c2d0}label{display:block;margin:16px 0 6px;font-weight:600}input,select,textarea{width:100%;border:1px solid #465b74;background:#0c1727;color:#fff;padding:13px;border-radius:10px;font:inherit}textarea{resize:vertical}button{background:#dfbd77;color:#101827;border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.entry{padding:14px 0;border-top:1px solid #304158}.pill{border-radius:999px;padding:4px 9px;background:#344359;color:#fff;font-size:12px}.pending{color:#f2cc78}.approved{color:#9bdfae}.rejected{color:#f5a8aa}.error{color:#ffb0b0}.success{color:#a6e5b9}.hidden{display:none}</style></head><body><main><header><span class="brand">TAKEOVER LEAGUE</span><div class="bar"><a href="./index.html">Liga</a><a href="./login.html">Account</a><button id="logout">Abmelden</button></div></header><h1>My Training</h1><p id="welcome" class="muted">Anmeldung wird geprüft …</p><p id="message" role="status"></p><div id="content" class="hidden"><section class="card"><h2>Training einreichen</h2><p class="muted">Punkte und EXP werden erst nach Bestätigung durch deinen Trainer gutgeschrieben.</p><form id="form"><label for="kind">Trainingsart</label><select id="kind" required><option value="">Bitte wählen</option></select><p id="points" class="muted"></p><label for="date">Trainingsdatum</label><input id="date" type="date" required><label for="notes">Bemerkung (optional)</label><textarea id="notes" rows="3" maxlength="500" placeholder="Kurze Notiz zum Training"></textarea><p><button id="submit" type="submit">Training einreichen</button></p></form></section><section class="card"><div class="line"><h2>Meine Eingaben</h2><button id="refresh" type="button">Aktualisieren</button></div><div id="entries">Lade …</div></section></div></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://iqarjivcrddcixrvqbfb.supabase.co','sb_publishable_o--Z21P8Q08lMvIOask_Fw__SRRX7_R');
const $=id=>document.getElementById(id);let profile=null;let types=[];const show=(message,cls='')=>{$('message').textContent=message;$('message').className=cls};
const today=new Date();$('date').value=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
async function init(){const {data:{user},error}=await db.auth.getUser();if(error||!user){show('Bitte zuerst unter login.html anmelden.','error');return}const p=await db.from('profiles').select('id,display_name,role,is_active').eq('auth_user_id',user.id).maybeSingle();if(p.error||!p.data||!p.data.is_active){show('Kein aktives Boxerprofil gefunden.','error');return}profile=p.data;if(profile.role!=='boxer'){show('Diese Eingabeseite ist für Boxer. Trainer nutzen coach.html.','error');return}$('welcome').textContent=`Willkommen, ${profile.display_name}.`;const t=await db.from('training_types').select('id,name,points').eq('is_active',true).order('name');if(t.error){show('Trainingsarten konnten nicht geladen werden: '+t.error.message,'error');return}types=t.data;for(const type of types){const o=document.createElement('option');o.value=type.id;o.textContent=type.name;$('kind').append(o)}if(!types.length){show('Es sind noch keine Trainingsarten hinterlegt. Bitte den Trainer informieren.','error');$('submit').disabled=true}$('content').classList.remove('hidden');await load()}
$('kind').addEventListener('change',()=>{const t=types.find(x=>String(x.id)===$('kind').value);$('points').textContent=t?`Vorgesehene Punkte nach Bestätigung: ${t.points}`:''});
async function load(){const r=await db.from('training_submissions').select('id,training_type_id,training_date,notes,status,created_at').eq('boxer_id',profile.id).order('created_at',{ascending:false}).limit(50);if(r.error){show('Einträge konnten nicht geladen werden: '+r.error.message,'error');return}const root=$('entries');root.replaceChildren();if(!r.data.length){root.textContent='Noch keine Trainings eingereicht.';return}for(const s of r.data){const div=document.createElement('div');div.className='entry';const head=document.createElement('div');head.className='line';const name=document.createElement('strong');name.textContent=types.find(x=>x.id===s.training_type_id)?.name||'Training';const status=document.createElement('span');status.className='pill '+s.status;status.textContent=({pending:'Ausstehend',approved:'Bestätigt',rejected:'Abgelehnt'})[s.status]||s.status;head.append(name,status);const detail=document.createElement('p');detail.className='muted';detail.textContent=s.training_date+(s.notes?' · '+s.notes:'');div.append(head,detail);root.append(div)}}
$('form').addEventListener('submit',async e=>{e.preventDefault();const type=types.find(x=>String(x.id)===$('kind').value);if(!type)return show('Bitte Trainingsart wählen.','error');$('submit').disabled=true;show('Training wird eingereicht …');const r=await db.from('training_submissions').insert({boxer_id:profile.id,training_type_id:type.id,training_date:$('date').value,notes:$('notes').value.trim(),status:'pending'});$('submit').disabled=false;if(r.error){show('Einreichen fehlgeschlagen: '+r.error.message,'error');return}show('Training eingereicht – wartet auf Bestätigung.','success');$('notes').value='';await load()});$('refresh').addEventListener('click',load);$('logout').addEventListener('click',async()=>{await db.auth.signOut();location.href='./login.html'});await init();
</script></body></html>
