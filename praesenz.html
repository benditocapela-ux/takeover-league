<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Präsenz · Takeover League</title>
<style>:root{color-scheme:dark;font:16px system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;padding:var(--sp-5) var(--sp-4) 110px;background:var(--bg);color:var(--text)}main{max-width:820px;margin:auto}h1{color:var(--gold)}a{color:var(--gold)}button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}</style>
<link rel="stylesheet" href="./takeover-navigation.css"><link rel="stylesheet" href="./takeover-theme.css"><link rel="stylesheet" href="./takeover-redesign.css"></head><body data-tl-screen="praesenz">
<main><div class="tl-screen-ribbon" aria-label="Aktueller Bereich: Präsenz"><div class="tl-screen-identity"><span class="tl-screen-symbol" aria-hidden="true">📅</span><div><div class="tl-screen-eyebrow">TAKEOVER LEAGUE · Training im Gym</div><div class="tl-screen-title">Präsenz</div></div></div><div class="tl-screen-links"><a href="./praesenz.html" class="tl-screen-primary">Präsenz</a><a href="./wochenplan.html">Wochenplan</a><a href="./checkin.html">Check-in</a></div></div>
<p class="tl-subnav"><a href="./boxer.html">← Mein Studio</a></p>
<h1 id="pageTitle">Präsenz</h1>
<p id="status" class="tlp-status" role="status">Wird geladen …</p>
<div id="app"></div>
</main>
<script src="./takeover-performance.js" defer></script>
<script type="module">
const P=window.TLPerf,$=id=>document.getElementById(id),app=$('app'),status=$('status');
const say=(t,err)=>{status.textContent=t;status.classList.toggle('error',!!err);status.hidden=!t};
let db,overview=[],filter='alle',groups=[];
const DAYS=['MO','DI','MI','DO','FR','SA','SO'];
function boxerView(d,live){
 if(!d.enabled)return '<div class="tlp-panel">Die Präsenz ist noch nicht freigeschaltet.</div>';
 const g=d.group,w0=d.weeks[0],target=w0.target,month=d.days.reduce((t,x)=>t+(x.trainings>0?1:0),0),gym=d.days.filter(x=>x.gym).length;
 const checkin=live.length?`<div class="tlp-panel tlp-sys"><div class="tlp-eyebrow gold">Training läuft</div>${live.map(s=>`<div class="tlp-row spread"><span><b>${P.esc(s.training_type)}</b><span class="tlp-note">${s.duration_minutes} Min.</span></span>${s.checked_in?'<span class="tlp-pill ok">eingecheckt</span>':`<button type="button" class="tlp-btn small" data-checkin="${s.id}">Einchecken</button>`}</div>`).join('')}</div>`:'';
 return `${checkin}
  <div class="tlp-panel"><div class="tlp-row spread"><div><div class="tlp-eyebrow">Deine Gruppe</div><b class="tlp-catname">${g?P.esc(g.name):'Noch keine Gruppe'}</b></div><div class="tlp-right"><div class="tlp-eyebrow">Wochenziel</div><b class="tlp-catname">${target} Trainings</b></div></div>
   <div class="tlp-bar mid big"><i style="width:${Math.min(100,w0.trainings/target*100)}%"></i></div><span class="tlp-note">Diese Woche: <b>${w0.trainings} von ${target}</b>${w0.met?' · Ziel erreicht!':' · noch '+(target-w0.trainings)}${g?'':' · Dein Coach teilt dich bald einer Gruppe zu.'}</span></div>
  <div class="tlp-kpis"><div class="tlp-kpi"><b>${d.streak_weeks}</b><span>Wochen in Folge Ziel erreicht</span></div><div class="tlp-kpi"><b>${month}</b><span>Trainingstage in 4 Wochen</span></div><div class="tlp-kpi"><b>${gym}</b><span>Gym-Check-ins</span></div><div class="tlp-kpi"><b>${d.weeks.filter(w=>w.met).length}/4</b><span>Wochenziele erreicht</span></div></div>
  <div class="tlp-panel"><div class="tlp-row spread"><b>Letzte 4 Wochen</b><span class="tlp-note">grün = bestätigtes Training</span></div>
   <div class="tlp-heat">${DAYS.map(x=>`<span class="hd">${x}</span>`).join('')}${d.days.map(x=>`<span class="hc${x.trainings?' on':''}${x.pending&&!x.trainings?' pend':''}${x.date===d.today?' now':''}${x.date>d.today?' future':''}" title="${P.fmtDate(x.date)}: ${x.trainings?x.trainings+' Training(s)':x.pending?'wartet auf Bestätigung':'kein Training'}" aria-label="${P.fmtDate(x.date)}: ${x.trainings?x.trainings+' Training(s)':'kein Training'}"></span>`).join('')}</div></div>
  <div class="tlp-panel"><b>Wochen</b>${d.weeks.map(w=>`<div class="tlp-li static"><span class="tlp-grow"><b>${w.current?'Diese Woche':'Woche ab '+P.fmtDate(w.week_start)}</b><span class="tlp-note">${w.trainings} von ${w.target} Trainings</span></span><span class="tlp-pill ${w.met?'ok':w.current?'gold':''}">${w.met?'Ziel erreicht':w.current?'läuft':'nicht erreicht'}</span></div>`).join('')}</div>`;
}
function staffView(){
 const rows=overview.filter(x=>filter==='alle'||(filter==='ohne'?!x.group:x.group&&x.group.key===filter)).map(x=>{const w=x.weeks[0];return {...x,w,below:!w.met}}).sort((a,b)=>(b.below-a.below)||a.display_name.localeCompare(b.display_name,'de'));
 return `<div class="tlp-chips" role="group" aria-label="Gruppe">${[['alle','Alle']].concat(groups.map(g=>[g.key,g.name])).concat([['ohne','Ohne Gruppe']]).map(([k,l])=>`<button type="button" class="tlp-chipbtn" aria-pressed="${filter===k}" data-filter="${k}">${P.esc(l)}</button>`).join('')}</div>
  <div class="tlp-panel"><p class="tlp-note">Oben stehen alle, die ihr Wochenziel diese Woche noch nicht erreicht haben. Die Punkte zeigen die letzten 4 Wochen (links: diese Woche).</p>
  <div class="tlp-list">${rows.map(x=>`<div class="tlp-li static"><span class="tlp-grow"><b>${P.esc(x.display_name)}</b><span class="tlp-note">${x.group?P.esc(x.group.name):'ohne Gruppe'} · diese Woche ${x.w.trainings}/${x.w.target} · Serie ${x.streak_weeks} · zuletzt ${x.last_training?P.fmtDate(x.last_training):'noch nie'}</span></span><span class="tlp-dots">${x.weeks.map(w=>`<i class="${w.met?'ok':w.current?'cur':''}" title="${w.trainings}/${w.target}"></i>`).join('')}</span></div>`).join('')||'<p class="tlp-note">Keine Boxer in dieser Auswahl.</p>'}</div></div>`;
}
async function load(){
 const me=await db.rpc('get_my_performance');if(me.error){say(me.error.message,true);return}
 const role=me.data.profile.role;
 if(role==='admin'||role==='coach'){
  $('pageTitle').textContent='Präsenz der Boxer';
  const [o,g]=await Promise.all([db.rpc('staff_presence_overview'),db.rpc('list_training_groups')]);
  if(o.error||g.error){say((o.error||g.error).message,true);return}
  overview=o.data||[];groups=g.data||[];say('');app.innerHTML=staffView();return;
 }
 const [p,l]=await Promise.all([db.rpc('get_my_presence'),db.rpc('my_gym_sessions_today')]);
 if(p.error||l.error){say((p.error||l.error).message,true);return}
 say('');app.innerHTML=boxerView(p.data,l.data||[]);
}
app.addEventListener('click',async ev=>{
 const b=ev.target.closest('button');if(!b)return;
 if(b.dataset.filter){filter=b.dataset.filter;app.innerHTML=staffView();return}
 if(b.dataset.checkin){b.disabled=true;const r=await db.rpc('gym_check_in',{p_session_id:Number(b.dataset.checkin)});if(r.error){say(r.error.message,true);b.disabled=false;return}await load();say('Eingecheckt!')}
});
(async()=>{
 try{
  db=await P.client();
  const s=await db.auth.getSession();
  if(!s.data||!s.data.session){say('');app.innerHTML='<div class="tlp-panel">Bitte <a href="./login.html">anmelden</a>.</div>';return}
  await load();
 }catch(e){say('Präsenz konnte nicht geladen werden: '+(e.message||e),true)}
})();
</script>
<script src="./takeover-navigation.js" defer></script></body></html>
