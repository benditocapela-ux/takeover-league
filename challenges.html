<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coach Challenges · Takeover League</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,Arial,sans-serif}*{box-sizing:border-box}
body{margin:0;padding:18px;background:#0b1422;color:#f5f5f6}main{max-width:820px;margin:auto}
a,.brand{color:#dfbd77}.brand{font-weight:850;letter-spacing:2px}
header,.line,.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card{background:#142238;border:1px solid #314058;border-radius:16px;padding:20px;margin:18px 0}
.muted{color:#b6c2d0}.hidden{display:none}.error{color:#ffb0b0}
label{display:block;margin:12px 0 5px;font-weight:700}
input,textarea,select,button{font:inherit;padding:11px;border-radius:10px}
input,textarea,select{width:100%;background:#0c1727;color:#fff;border:1px solid #465b74}
button{border:0;background:#dfbd77;color:#101827;font-weight:800;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#263850;color:#fff}
.challenge{border-top:1px solid #34465f;padding:16px 0}.challenge strong{color:#dfbd77}
.actions{justify-content:flex-start;margin-top:10px}
</style></head><body><main>
<header><span class="brand">TAKEOVER LEAGUE</span><nav><a href="./index.html">Liga</a> · <a href="./duels.html">Duelle</a></nav></header>
<h1>🏆 Coach Challenges <small class="muted">2.0</small></h1>
<p id="status" class="muted" role="status">Anmeldung wird geprüft …</p>
<div id="app" class="hidden">
<section id="coachPanel" class="card hidden"><h2>Challenge-Entwurf erstellen</h2>
<p class="muted">Noch keine Ziele, Starttermine oder EXP-Auszahlungen. Ein Entwurf kann für Anmeldungen geöffnet werden.</p>
<form id="createForm">
<label for="title">Titel</label><input id="title" maxlength="120" minlength="3" required>
<label for="description">Beschreibung</label><textarea id="description" rows="3"></textarea>
<label for="kind">Art</label><select id="kind"><option value="individual">Individuell</option><option value="competition">Wettbewerb</option><option value="coach_goal">Trainerziel</option></select>
<label for="duration">Dauer</label><select id="duration"><option value="7">7 Tage</option><option value="14">14 Tage</option><option value="30">30 Tage</option></select>
<p><button id="createButton" type="submit">Entwurf speichern</button></p></form></section>
<section class="card"><div class="line"><h2>Challenges</h2><button id="refresh" class="secondary" type="button">Aktualisieren</button></div>
<div id="challengeList" aria-live="polite">Wird geladen …</div></section>
</div></main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://iqarjivcrddcixrvqbfb.supabase.co','sb_publishable_o--Z21P8Q08lMvIOask_Fw__SRRX7_R');
const $=id=>document.getElementById(id);
let me=null,sequence=0;
const labels={draft:'Entwurf',open:'Anmeldung offen',active:'Aktiv',awaiting_reviews:'Wartet auf Freigaben',settled:'Abgeschlossen',cancelled:'Abgesagt'};
function status(message,error=false){$('status').textContent=message;$('status').className=error?'error':'muted'}
function button(label,secondary,action){
 const el=document.createElement('button');el.type='button';el.textContent=label;
 if(secondary)el.className='secondary';
 el.addEventListener('click',async()=>{el.disabled=true;try{await action();await refresh()}catch(e){status(e.message,true)}finally{el.disabled=false}});
 return el;
}
async function rpc(name,args){const r=await db.rpc(name,args);if(r.error)throw r.error;return r.data}
async function refresh(){
 const current=++sequence;
 const rows=await rpc('coach_challenge_v2_list');
 if(current!==sequence)return false;
 const list=$('challengeList');list.replaceChildren();
 if(!rows?.length){list.textContent='Noch keine sichtbaren Challenges.';return true}
 for(const c of rows){
  const article=document.createElement('article');article.className='challenge';
  const title=document.createElement('strong');title.textContent=c.title;
  const details=document.createElement('p');
  details.textContent=(labels[c.status]||c.status)+' · '+c.duration_days+' Tage · '+c.joined_count+' angemeldet';
  article.append(title,details);
  if(c.description){const desc=document.createElement('p');desc.textContent=c.description;article.append(desc)}
  if(c.my_enrollment_status){const joined=document.createElement('p');joined.className='muted';joined.textContent='Dein Teilnahmestatus: '+(c.my_enrollment_status==='joined'?'Angemeldet':c.my_enrollment_status==='withdrawn'?'Zurückgezogen':c.my_enrollment_status);article.append(joined)}
  const actions=document.createElement('div');actions.className='actions';
  if(me.role==='boxer'&&c.status==='open'&&!c.my_enrollment_status)
   actions.append(button('Teilnehmen',false,async()=>{await rpc('coach_challenge_v2_join',{p_challenge_id:c.id});status('Anmeldung gespeichert.')}));
  if(me.role==='boxer'&&c.status==='open'&&c.my_enrollment_status==='joined')
   actions.append(button('Abmelden',true,async()=>{await rpc('coach_challenge_v2_withdraw',{p_challenge_id:c.id});status('Abmeldung gespeichert.')}));
  if(me.role!=='boxer'&&(c.is_creator||me.role==='admin')){
   if(c.status==='draft')actions.append(button('Anmeldung öffnen',false,async()=>{await rpc('coach_challenge_v2_manage',{p_challenge_id:c.id,p_action:'open'});status('Anmeldung geöffnet.')}));
   if(['draft','open'].includes(c.status))actions.append(button('Absagen',true,async()=>{
    if(!confirm('Diese Challenge wirklich absagen?'))return;
    await rpc('coach_challenge_v2_manage',{p_challenge_id:c.id,p_action:'cancel'});status('Challenge abgesagt.');
   }));
  }
  if(actions.childElementCount)article.append(actions);
  list.append(article);
 }
 return true;
}
async function init(){
 const {data:{user},error}=await db.auth.getUser();
 if(error||!user){location.replace('./login.html?next=challenges.html');return}
 const p=await db.from('profiles').select('id,role,is_active').eq('auth_user_id',user.id).maybeSingle();
 if(p.error||!p.data?.is_active||!['boxer','coach','admin'].includes(p.data.role)){status('Aktives Liga-Konto erforderlich.',true);return}
 me=p.data;
 const flag=await db.from('league_feature_flags').select('is_enabled').eq('feature_key','coach_challenges').maybeSingle();
 if(flag.error||flag.data?.is_enabled!==true){status('Coach Challenges sind noch nicht freigeschaltet.');return}
 if(me.role!=='boxer')$('coachPanel').classList.remove('hidden');
 $('app').classList.remove('hidden');
 try{await refresh();status('Challenge-Übersicht geladen.')}catch(e){status('Challenges konnten nicht geladen werden: '+e.message,true)}
}
$('createForm').addEventListener('submit',async e=>{
 e.preventDefault();const control=$('createButton');control.disabled=true;
 try{
  await rpc('coach_challenge_v2_create_draft',{p_title:$('title').value,p_description:$('description').value,p_kind:$('kind').value,p_duration_days:Number($('duration').value)});
  $('createForm').reset();status('Challenge-Entwurf erstellt.');await refresh();
 }catch(err){status('Erstellen fehlgeschlagen: '+err.message,true)}
 finally{control.disabled=false}
});
$('refresh').addEventListener('click',async()=>{
 const control=$('refresh');control.disabled=true;
 try{if(await refresh())status('Challenge-Übersicht aktualisiert.')}catch(e){status('Aktualisierung fehlgeschlagen: '+e.message,true)}
 finally{control.disabled=false}
});
init();
</script></body></html>
