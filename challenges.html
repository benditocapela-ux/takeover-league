<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coach Challenges · Takeover League</title>
<style>body{font:16px system-ui;background:#0b1422;color:#f5f5f6;margin:0;padding:20px}main{max-width:920px;margin:auto}a{color:#dfbd77}h1{color:#dfbd77}article{background:#16263a;border:1px solid #324359;border-radius:14px;padding:18px;margin:14px 0}button{background:#dfbd77;color:#111;border:0;border-radius:8px;padding:10px 14px;margin:5px;cursor:pointer}button:disabled{opacity:.5}input,textarea,select{background:#0b1422;color:white;border:1px solid #52647c;border-radius:8px;padding:10px;max-width:100%;box-sizing:border-box}form{display:grid;gap:10px;max-width:550px}small{color:#bdc8d4}.error{color:#ffb6b6}</style></head>
<body><main><p><a href="./boxer.html">Produktions-Boxeransicht</a> · <a href="./coach.html">Produktions-Coachansicht</a></p><h1>Coach Challenges V2</h1><p><strong>PRODUKTIONSVORBEREITUNG</strong> – Challenges sind noch nicht freigeschaltet.</p><p>Die Freischaltung erfolgt erst nach geprüfter Datenbankmigration und Berechtigungsprüfung.</p><p id="status" role="status">Verbindung wird geprüft …</p><section id="signin"><h2>Konto anmelden</h2><form id="login"><input name="email" type="email" autocomplete="username" placeholder="E-Mail" required><input name="password" type="password" autocomplete="current-password" placeholder="Passwort" required><button>Anmelden</button></form><button id="logout" type="button" hidden>Abmelden</button></section><section id="coach" hidden><h2>Challenge erstellen</h2><form id="create"><input name="title" required maxlength="120" placeholder="Titel"><textarea name="description" placeholder="Beschreibung"></textarea><select name="kind"><option value="individual">Individuell</option><option value="group">Gruppe</option></select><input name="days" type="number" min="1" max="365" value="7" required><button>Entwurf erstellen</button></form></section><section id="list"></section></main>
<script>window.TAKEOVER_CHALLENGES_V2_ENABLED=false;</script><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const status=document.querySelector('#status'),list=document.querySelector('#list'),coach=document.querySelector('#coach'),login=document.querySelector('#login'),logout=document.querySelector('#logout');
const say=(s,error=false)=>{status.textContent=s;status.className=error?'error':''};
const friendlyError=e=>{const msg=String(e?.message||e||'Unbekannter Fehler');if(/jwt expired|invalid jwt/i.test(msg))return 'Sitzung abgelaufen. Bitte neu anmelden.';if(/failed to fetch|networkerror/i.test(msg))return 'Netzwerkfehler. Bitte Verbindung prüfen und erneut versuchen.';return msg};
const el=(tag,text)=>{const e=document.createElement(tag);e.textContent=text;return e};
let db,role='',busy=false;
async function rpc(name,args={}){const r=await db.rpc(name,args);if(r.error)throw r.error;return r.data}
async function act(name,args){if(busy)return;busy=true;try{say('Wird verarbeitet …');await rpc(name,args);await load()}catch(e){say(friendlyError(e),true)}finally{busy=false}}
function action(parent,label,name,id){const b=el('button',label);b.type='button';b.onclick=()=>act(name,{p_challenge_id:id});parent.append(b)}
async function load(){const data=await rpc('coach_challenge_v2_list');list.replaceChildren();if(!(data||[]).length)list.append(el('p','Noch keine Challenges vorhanden.'));for(const c of data||[]){const a=document.createElement('article');a.append(el('h2',c.title),el('p',c.description||''),el('small',c.status+' · '+c.joined_count+' Teilnehmende · '+c.duration_days+' Tage'));if(c.status==='open'&&(!c.my_enrollment_status||c.my_enrollment_status==='withdrawn')&&role==='boxer')action(a,'Teilnehmen','coach_challenge_v2_join',c.id);if(role==='boxer'&&c.my_enrollment_status==='joined'&&c.status==='open')action(a,'Teilnahme zurückziehen','coach_challenge_v2_withdraw',c.id);if(['coach','admin'].includes(role)&&c.is_creator&&c.status==='open')action(a,'Challenge starten','coach_challenge_v2_activate',c.id);
if(['coach','admin'].includes(role)&&c.is_creator&&c.status==='active'&&c.ends_at&&new Date(c.ends_at)<=new Date())action(a,'Bewertung beginnen','coach_challenge_v2_begin_reviews',c.id);
if(['coach','admin'].includes(role)&&c.is_creator&&c.status==='draft'){
const goal=document.createElement('form');goal.setAttribute('aria-label','Ziel und EXP für '+c.title);
const description=el('textarea','');description.setAttribute('aria-label','Challenge-Ziel');description.placeholder='Individuelles Ziel (mind. 5 Zeichen)';description.required=true;description.minLength=5;description.maxLength=1000;
const reward=document.createElement('select');reward.setAttribute('aria-label','EXP-Belohnung');for(const n of [25,50,100,150,200]){const o=el('option',n+' EXP');o.value=n;reward.append(o)}
const save=el('button','Ziel und EXP speichern');save.type='submit';goal.append(description,reward,save);
goal.onsubmit=e=>{e.preventDefault();act('coach_challenge_v2_save_goal_reward',{p_challenge_id:c.id,p_goal_text:description.value,p_review_mode:'manual',p_reward_exp:Number(reward.value),p_target_value:null,p_metric:null})};a.append(goal);
}
if(['coach','admin'].includes(role)&&c.is_creator&&c.status==='draft'){const open=el('button','Öffnen');open.type='button';open.onclick=()=>{if(confirm('Challenge für Boxer öffnen? Ziel und EXP müssen gespeichert sein.'))act('coach_challenge_v2_manage',{p_challenge_id:c.id,p_action:'open'})};a.append(open);}if(['coach','admin'].includes(role)&&c.is_creator&&c.status==='awaiting_reviews'){
const review=el('button','Offene Bewertungen laden');review.type='button';
review.onclick=async()=>{review.disabled=true;say('Bewertungen werden geladen …');try{const people=await rpc('coach_challenge_v2_review_candidates',{p_challenge_id:c.id});
for(const p of people){const line=document.createElement('div');line.append(el('span',p.display_name+' '));const reason=document.createElement('input');reason.type='text';reason.setAttribute('aria-label','Begründung für '+p.display_name);reason.placeholder='Begründung (5–1000 Zeichen)';reason.maxLength=1000;line.append(reason);
for(const [label,approved] of [['Bestanden',true],['Nicht bestanden',false]]){const b=el('button',label);b.type='button';b.onclick=()=>{if(reason.value.trim().length<5){say('Begründung mindestens 5 Zeichen',true);return}act('coach_challenge_v2_review_manual',{p_challenge_id:c.id,p_boxer_id:p.boxer_id,p_approved:approved,p_reason:reason.value.trim()})};line.append(b)}a.append(line)}
if(!people.length){a.append(el('p','Keine offenen Bewertungen.'));settle.disabled=false;settle.title='Alle Bewertungen erfasst – Abschluss möglich'}else{a.append(el('p',people.length+' offene Bewertungen – Abschluss gesperrt.'))}say(people.length+' offene Bewertungen geladen.')}catch(e){review.disabled=false;say(friendlyError(e),true)}};a.append(review);
const settle=el('button','EXP abschliessen');settle.type='button';settle.disabled=true;settle.title='Zuerst offene Bewertungen prüfen';settle.onclick=()=>{if(confirm('Alle Bewertungen abgeschlossen? EXP jetzt verbuchen?'))act('coach_challenge_v2_settle_manual',{p_challenge_id:c.id})};a.append(settle)}
list.append(a)}say((data||[]).length+' Challenges geladen.')}
async function init(){try{if(!window.TAKEOVER_CHALLENGES_V2_ENABLED){document.querySelector('#signin').hidden=true;coach.hidden=true;login.hidden=true;logout.hidden=true;list.replaceChildren();say('Coach Challenges werden vorbereitet. Trainingspunkte bleiben unverändert.');return}db=createClient('https://iqarjivcrddcixrvqbfb.supabase.co','sb_publishable_o--Z21P8Q08lMvIOask_Fw__SRRX7_R');const {data:{user},error:authError}=await db.auth.getUser();if(authError){role='';coach.hidden=true;list.replaceChildren();throw authError}if(!user){role='';login.hidden=false;logout.hidden=true;coach.hidden=true;list.replaceChildren();throw Error('Bitte mit einem Testkonto anmelden.')}login.hidden=true;logout.hidden=false;const p=await db.from('profiles').select('role,is_active').eq('auth_user_id',user.id).maybeSingle();if(p.error){role='';coach.hidden=true;list.replaceChildren();logout.hidden=false;throw p.error}if(!p.data?.is_active){role='';coach.hidden=true;list.replaceChildren();logout.hidden=false;throw Error('Kein aktives Profil')}if(!['boxer','coach','admin'].includes(p.data.role)){role='';coach.hidden=true;list.replaceChildren();logout.hidden=false;throw Error('Unbekannte Profil-Rolle')}role=p.data.role;coach.hidden=!['admin','coach'].includes(role);await load()}catch(e){say(friendlyError(e),true)}}
login.onsubmit=async e=>{e.preventDefault();const f=new FormData(login);say('Anmeldung läuft …');try{const {error}=await db.auth.signInWithPassword({email:String(f.get('email')),password:String(f.get('password'))});if(error)throw error;login.reset();await init()}catch(err){say(friendlyError(err),true)}};logout.onclick=async()=>{try{const {error}=await db.auth.signOut();if(error)throw error;role='';coach.hidden=true;list.replaceChildren();login.hidden=false;logout.hidden=true;say('Abgemeldet.')}catch(e){say('Abmeldung fehlgeschlagen: '+e.message,true)}};
document.querySelector('#create').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;const f=new FormData(e.target);try{await rpc('coach_challenge_v2_create_draft',{p_title:f.get('title'),p_description:f.get('description'),p_kind:f.get('kind'),p_duration_days:Number(f.get('days'))});e.target.reset();await load()}catch(err){say(friendlyError(err),true)}finally{busy=false}};
init();
</script></body></html>
