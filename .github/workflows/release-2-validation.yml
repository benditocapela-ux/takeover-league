name: Takeover League 2 - staging validation (no deploy)
on:
  push:
    branches: [release/takeover-league-2-ready]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-and-existing-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false jsdom@26.1.0
      - run: node tests/release-static-contracts.cjs
      - run: node tests/holo-emote-podium-contracts.cjs
      - run: node tests/holo-gear-previews-contracts.cjs
      - run: node tests/mein-boxer-editor-art-contracts.cjs
      - run: node tests/mein-boxer-artpack-contracts.cjs
      - run: node tests/design-foundation-check.cjs
      - run: node tests/redesign-all-pages.cjs
      - run: node tests/redesign-accessibility.cjs
      - run: node tests/redesign-contracts.cjs
      - run: node tests/guest-showcase.cjs
      - run: node tests/admin-registration-static.cjs
      - run: node tests/release-ux-staging.cjs
      - run: node tests/features-live-directory.cjs
      - run: node tests/boxer-profile-actions.cjs
      - run: node tests/menu-navigation-compat.cjs
      - run: node tests/boxer-dashboard-polish.cjs
      - run: node --check tests/league-21-auth-staging-readonly.cjs
      - run: node tests/build-league-21-release.cjs --check
      - run: node tests/league-21-foundations.cjs
      - run: node tests/ux-roadmap-phase0.cjs

  chromium-public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/release-browser-smoke.cjs
        timeout-minutes: 4
      - run: node tests/release-auth-ui-mocked.cjs
        timeout-minutes: 4
      - run: node tests/boxer-responsive-layout-browser.cjs
        timeout-minutes: 4
      - run: node tests/release-live-duels-browser.cjs
        timeout-minutes: 4
      - run: node tests/league-21-browser.cjs
        timeout-minutes: 4
      - run: node tests/admin-registration-browser.cjs
      - run: node tests/account-switch-browser.cjs
      - run: node tests/training-tabs-browser.cjs
        timeout-minutes: 4
      - run: node tests/performance-browser.cjs
      - run: node tests/news-feedback-browser.cjs
      - run: node tests/help-tutorial-browser.cjs
      - run: node tests/card-designs-browser.cjs
      - name: Capture Mein-Boxer mobile browser screenshots
        run: mkdir -p "${{ runner.temp }}/mein-boxer-shots"
      - name: Boxer-Holo integration with screenshots
        env:
          SHOTS: ${{ runner.temp }}/mein-boxer-shots
        run: node tests/boxer-holo-browser.cjs
        timeout-minutes: 4
      - run: node tests/self-rating-browser.cjs
      - run: node tests/card-scale-browser.cjs
      - run: node tests/club-types-selfservice-browser.cjs
      - run: node tests/scaled-everywhere-browser.cjs
      - run: node tests/kg-cards-everywhere-browser.cjs
      - run: node tests/admin-bonus-exp-browser.cjs
      - run: node tests/card-arena-browser.cjs
      - run: node tests/looks-everywhere-browser.cjs
      - run: node tests/card-designs-personal-browser.cjs
      - run: node tests/award-designs-limited-browser.cjs
      - run: node tests/award-skip-revoke-browser.cjs
        timeout-minutes: 4
      - run: node tests/gym-browser.cjs
        timeout-minutes: 4
      - run: node tests/quests-browser.cjs
        timeout-minutes: 4
      - run: node tests/kampfgeist-browser.cjs
        timeout-minutes: 5
      - run: node tests/kampfgeist5-browser.cjs
        timeout-minutes: 5
      - run: node tests/club-tiers-browser.cjs
        timeout-minutes: 5
      - run: node tests/coach-feedback-browser.cjs
        timeout-minutes: 5

      - name: Save rendered Mein-Boxer screens for design review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mein-boxer-rendered-screens
          path: ${{ runner.temp }}/mein-boxer-shots/*.png
          if-no-files-found: ignore
          retention-days: 14
