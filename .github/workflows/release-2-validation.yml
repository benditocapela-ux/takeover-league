name: Takeover League 2 - staging validation (no deploy)
on:
  push:
    branches: [release/takeover-league-2-ready]
  pull_request:
    branches: [main]
  workflow_dispatch:
# A new PR commit supersedes old screenshots and test results. Cancel stale
# staging work, never the unrelated GitHub Pages deployment workflow.
concurrency:
  group: release2-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  static-and-existing-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false jsdom@26.1.0
      - run: node tests/release-static-contracts.cjs
      - run: node tests/holo-emote-podium-contracts.cjs
      - run: node tests/holo-gear-previews-contracts.cjs
      - run: node tests/mein-boxer-editor-art-contracts.cjs
      - run: node tests/mein-boxer-artpack-contracts.cjs
      - run: node tests/mein-boxer-modular-art-contracts.cjs
      - run: node tests/mein-boxer-modular-editor-contracts.cjs
      - run: node tests/mein-boxer-draft-layers-contracts.cjs
      - run: node tests/mein-boxer-anatomy-blockout-contracts.cjs
      - run: node tests/mein-boxer-custom-underpaint-contracts.cjs
      - run: node tests/import-original-cool-contracts.cjs
      - run: node tests/mein-boxer-installed-art-contracts.cjs
      - run: node tests/boxer-original-art-readiness-contracts.cjs
      - run: node tests/boxer-original-art-readiness.cjs
      - run: node tests/mein-boxer-preload-performance.cjs
      - run: node tests/publish-boxer-artpack-contracts.cjs
      - run: node tests/boxer-pages-build.cjs
      - run: node tests/boxer-character-architecture.cjs
      - run: node tests/validate-boxer-artpack-contracts.cjs
      - run: node tests/report-boxer-artpack-contracts.cjs
      - run: node scripts/report-boxer-artpack.cjs
      - run: node scripts/validate-boxer-artpack.cjs
      - run: node tests/design-foundation-check.cjs
      - run: node tests/redesign-all-pages.cjs
      - run: node tests/redesign-accessibility.cjs
      - run: node tests/redesign-contracts.cjs
      - run: node tests/guest-showcase.cjs
      - run: node tests/admin-registration-static.cjs
      - run: node tests/release-ux-staging.cjs
      - run: node tests/features-live-directory.cjs
      - run: node tests/boxer-profile-actions.cjs
      - run: node tests/menu-navigation-compat.cjs
      - run: node tests/boxer-dashboard-polish.cjs
      - run: node --check tests/league-21-auth-staging-readonly.cjs
      - run: node tests/build-league-21-release.cjs --check
      - run: node tests/league-21-foundations.cjs
      - run: node tests/ux-roadmap-phase0.cjs

  chromium-public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/release-browser-smoke.cjs
        timeout-minutes: 4
      - run: node tests/release-auth-ui-mocked.cjs
        timeout-minutes: 4
      - run: node tests/boxer-responsive-layout-browser.cjs
        timeout-minutes: 4
      - run: node tests/boxer-editor-transactions-browser.cjs
        timeout-minutes: 4
      - run: node tests/boxer-art-review-browser.cjs
        timeout-minutes: 2
      - run: node tests/release-live-duels-browser.cjs
        timeout-minutes: 4
      - run: node tests/league-21-browser.cjs
        timeout-minutes: 4
      - run: node tests/admin-registration-browser.cjs
      - run: node tests/account-switch-browser.cjs
      - run: node tests/training-tabs-browser.cjs
        timeout-minutes: 4
      - run: node tests/performance-browser.cjs
      - run: node tests/news-feedback-browser.cjs
      - run: node tests/help-tutorial-browser.cjs
      - run: node tests/card-designs-browser.cjs
      - name: Capture Mein-Boxer mobile browser screenshots
        run: mkdir -p "${{ runner.temp }}/mein-boxer-shots"
      - name: Boxer-Holo integration with screenshots
        env:
          SHOTS: ${{ runner.temp }}/mein-boxer-shots
        run: node tests/boxer-holo-browser.cjs
        timeout-minutes: 4
      - run: node tests/self-rating-browser.cjs
      - run: node tests/card-scale-browser.cjs
      - run: node tests/club-types-selfservice-browser.cjs
      - run: node tests/scaled-everywhere-browser.cjs
      - run: node tests/kg-cards-everywhere-browser.cjs
      - run: node tests/admin-bonus-exp-browser.cjs
      - run: node tests/card-arena-browser.cjs
      - run: node tests/looks-everywhere-browser.cjs
      - run: node tests/card-designs-personal-browser.cjs
      - run: node tests/award-designs-limited-browser.cjs
      - run: node tests/award-skip-revoke-browser.cjs
        timeout-minutes: 4
      - run: node tests/gym-browser.cjs
        timeout-minutes: 4
      - run: node tests/quests-browser.cjs
        timeout-minutes: 4
      - run: node tests/kampfgeist-browser.cjs
        timeout-minutes: 5
      - run: node tests/kampfgeist5-browser.cjs
        timeout-minutes: 5
      - run: node tests/club-tiers-browser.cjs
        timeout-minutes: 5
      - run: node tests/coach-feedback-browser.cjs
        timeout-minutes: 5

      - name: Save rendered Mein-Boxer screens for design review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mein-boxer-rendered-screens
          path: ${{ runner.temp }}/mein-boxer-shots/*.png
          if-no-files-found: ignore
          retention-days: 14

  modular-art-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify editor and responsive SVG behavior in both browsers
        env:
          BROWSER: ${{ matrix.browser }}
          EDITOR_ONLY: '1'
        run: |
          node tests/boxer-holo-browser.cjs
          node tests/boxer-responsive-layout-browser.cjs
        timeout-minutes: 8
      - name: Verify 32 outfits and anatomical glove pixel regressions
        env:
          BROWSER: ${{ matrix.browser }}
        run: node tests/boxer-modular-art-browser.cjs
        timeout-minutes: 5
      - name: Verify all pose fallbacks and the isolated Pages assembly
        env:
          BROWSER: ${{ matrix.browser }}
          SHOTS: ${{ runner.temp }}/modular-art-shots
        run: node tests/boxer-pose-fallback-browser.cjs
        timeout-minutes: 5
      - name: Verify purchase receipts and network failures in both browsers
        env:
          BROWSER: ${{ matrix.browser }}
        run: node tests/boxer-editor-transactions-browser.cjs
        timeout-minutes: 4
      - name: Save unapproved modular draft screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modular-art-${{ matrix.browser }}
          path: |
            ${{ runner.temp }}/modular-art-shots/*.png
            ${{ runner.temp }}/modular-art-shots/*-glove-pixels.json
          if-no-files-found: ignore
          retention-days: 14

  training-v2-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Training 2.0 und Trainer-Dashboard 2.0 (Chromium + WebKit, gemocktes Supabase)
        run: SHOTS=training-v2-screenshots REQUIRE_WEBKIT=1 node tests/training-v2-browser.cjs
        timeout-minutes: 10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-v2-screenshots
          path: training-v2-screenshots
          if-no-files-found: warn
