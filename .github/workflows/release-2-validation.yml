name: Takeover League 2 - staging validation (no deploy)
on:
  push:
    branches: [release/takeover-league-2-ready]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-and-existing-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false jsdom@26.1.0
      - run: node tests/release-static-contracts.cjs
      - run: node tests/design-foundation-check.cjs
      - run: node tests/redesign-all-pages.cjs
      - run: node tests/redesign-accessibility.cjs
      - run: node tests/redesign-contracts.cjs
      - run: node tests/guest-showcase.cjs
      - run: node tests/admin-registration-static.cjs
      - run: node tests/release-ux-staging.cjs
      - run: node tests/features-live-directory.cjs
      - run: node tests/boxer-profile-actions.cjs
      - run: node tests/menu-navigation-compat.cjs
      - run: node tests/boxer-dashboard-polish.cjs
      - run: node --check tests/league-21-auth-staging-readonly.cjs
      - run: node tests/build-league-21-release.cjs --check
      - run: node tests/league-21-foundations.cjs
      - run: node tests/ux-roadmap-phase0.cjs

  chromium-public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/release-browser-smoke.cjs
      - run: node tests/release-auth-ui-mocked.cjs
      - run: node tests/boxer-responsive-layout-browser.cjs
      - run: node tests/release-live-duels-browser.cjs
      - run: node tests/league-21-browser.cjs
      - run: node tests/admin-registration-browser.cjs
