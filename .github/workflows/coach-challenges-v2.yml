    steps:
      - uses: actions/checkout@v4
      - name: Create isolated archive fixture database
        env:
          PGPASSWORD: postgres
        run: createdb -h localhost -U postgres club_archive_probe
      - name: Verify reversible archive/restore and access guards on PostgreSQL ${{ matrix.postgres }}
        env:
          PGPASSWORD: postgres
        run: psql -X -h localhost -U postgres -d club_archive_probe -v ON_ERROR_STOP=1 -f tests/club-profile-archive-schema.sql

  profile-archive-hides-locks-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16','17']
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated archive hide/lock fixture database
        env:
          PGPASSWORD: postgres
        run: createdb -h localhost -U postgres archive_lock_probe
      - name: Verify archive hides and locks, restore and signup backstop on PostgreSQL ${{ matrix.postgres }}
        env:
          PGPASSWORD: postgres
        run: psql -X -h localhost -U postgres -d archive_lock_probe -v ON_ERROR_STOP=1 -f tests/profile-archive-hides-locks-schema.sql
      - name: Verify guarded rollback and re-apply on PostgreSQL ${{ matrix.postgres }}
        env:
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          psql -X -h localhost -U postgres -d archive_lock_probe -v ON_ERROR_STOP=1 -f tests/profile-archive-hides-locks-rollback.sql | tee rollback.log
          grep -q "PASS: rollback refuses while archived" rollback.log

  gamification-fairness-notifications-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16','17']
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated gamification fixture database
        env:
          PGPASSWORD: postgres
        run: createdb -h localhost -U postgres gamification_probe
      - name: Verify public-only snapshots, masked names, notifications and level curve on PostgreSQL ${{ matrix.postgres }}
        env:
          PGPASSWORD: postgres
        run: psql -X -h localhost -U postgres -d gamification_probe -v ON_ERROR_STOP=1 -f tests/gamification-fairness-notifications-schema.sql
      - name: Verify rollback keeps rows and re-apply works on PostgreSQL ${{ matrix.postgres }}
        env:
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          psql -X -h localhost -U postgres -d gamification_probe -v ON_ERROR_STOP=1 -f tests/gamification-fairness-notifications-rollback.sql | tee rollback.log
          grep -q "PASS: rollback restores previous definitions" rollback.log

  revoke-unused-legacy-rpcs-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16','17']
    permissions:
      contents: read
    services:
