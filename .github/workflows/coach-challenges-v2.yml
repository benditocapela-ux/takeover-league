name: Coach Challenges V2 Preview Checks
on:
  pull_request:
    paths:
      - 'challenges-v2-preview.html'
      - 'tests/coach-challenges-v2.cjs'
      - 'tests/coach-challenges-v2-browser.cjs'
      - 'challenges.html'
      - 'supabase/production-prep/**'
      - 'supabase/migrations/**'
      - 'tests/production-v2-*.sql'
      - 'tests/production-v2-*.cjs'
      - 'tests/production-v2-schema-smoke.sql'
      - '.github/workflows/coach-challenges-v2.yml'
  push:
    branches: [feature/coach-challenges-v2-ui]
    paths:
      - 'challenges-v2-preview.html'
      - 'tests/coach-challenges-v2.cjs'
      - 'tests/coach-challenges-v2-browser.cjs'
      - 'challenges.html'
      - 'supabase/production-prep/**'
      - 'supabase/migrations/**'
      - 'tests/production-v2-*.sql'
      - 'tests/production-v2-*.cjs'
      - '.github/workflows/coach-challenges-v2.yml'
jobs:
  static-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock jsdom@26
      - run: node tests/coach-challenges-v2.cjs
      - run: node tests/coach-challenges-v2-browser.cjs
      - run: node tests/production-v2-migration-bundle.cjs

  schema-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply prepared V2 migrations to disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/production-v2-schema-smoke.sql
