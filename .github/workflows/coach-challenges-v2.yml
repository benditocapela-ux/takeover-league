name: Coach Challenges V2 Preview Checks
on:
  pull_request:
    paths:
      - 'challenges-v2-preview.html'
      - 'tests/coach-challenges-v2.cjs'
      - 'tests/coach-challenges-v2-browser.cjs'
      - '.github/workflows/coach-challenges-v2.yml'
  push:
    branches: [feature/coach-challenges-v2-ui]
    paths:
      - 'challenges-v2-preview.html'
      - 'tests/coach-challenges-v2.cjs'
      - '.github/workflows/coach-challenges-v2.yml'
jobs:
  static-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock jsdom@26
      - run: node tests/coach-challenges-v2.cjs
      - run: node tests/coach-challenges-v2-browser.cjs
