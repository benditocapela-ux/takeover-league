name: Takeover League 2.1 migration replay (disposable PG only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/production-prep/league_21_*.sql'
      - 'tests/league-21-*.sql'
      - 'tests/duel-points-preview-*'
      - 'tests/duel-points-boundaries-*'
      - 'tests/duel-notification-event-*'
      - 'tests/period-archive-*.sql'
      - 'tests/period-close-*'
      - 'tests/period-notices-*'
      - 'tests/duel-staff-queue-*'
      - 'tests/duel-metric-*'
      - 'tests/duel-metrics-*'
      - 'tests/duel-receipt-*'
      - 'tests/duel-v3-*'
      - 'tests/studio-history-*'
      - 'takeover-duel-metrics.js'
      - 'takeover-duel-close.js'
      - 'takeover-gamification.js'
      - 'supabase/production-prep/*20261102*.sql'
      - '.github/workflows/league-21-migration-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  period-and-duel-closures:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16','17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Shared duel scoring, read-only preview, explicit close and regressions
        run: |
          createdb league21_replay_duel_preview
          psql -X -d league21_replay_duel_preview -v ON_ERROR_STOP=1 -f tests/duel-points-preview-schema.sql
          psql -X -d league21_replay_duel_preview -v ON_ERROR_STOP=1 -f tests/duel-points-boundaries-transaction.sql
          # Queue counts use a pristine fixture; concurrency deliberately commits a result.
          psql -X -d league21_replay_duel_preview -v ON_ERROR_STOP=1 -f tests/duel-staff-queue-schema.sql -f tests/duel-staff-queue-rollback.sql
          PGDATABASE=league21_replay_duel_preview node tests/duel-points-preview-concurrency.cjs
          psql -X -d league21_replay_duel_preview -v ON_ERROR_STOP=1 -f tests/duel-points-preview-rollback.sql
          psql -X -d league21_replay_duel_preview -v ON_ERROR_STOP=1 -f tests/duel-notification-event-identity.sql
          psql -X -d league21_replay_duel_preview -v ON_ERROR_STOP=1 -f tests/duel-notification-event-identity-rollback.sql
      - name: Disabled metric contracts, real SQL-to-UI contract, receipt authority and concurrency
        env:
          PGDATABASE: league21_replay_duel_preview
        run: |
          node tests/duel-metric-test-bootstrap.cjs
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261102095422_duel_metric_contracts_disabled.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/duel-metric-contracts-transaction.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/duel-metric-ranked-transaction.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/duel-v3-points-privacy-transaction.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/duel-receipt-authority-transaction.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/duel-points-boundaries-transaction.sql
          node tests/duel-metrics-api-contracts.cjs
          psql -X -v ON_ERROR_STOP=1 -f tests/duel-metric-rollback.sql
          node tests/duel-receipt-rollback-guard.cjs
          DUEL_TEST_METRIC=training_count DUEL_TEST_REWARD=none node tests/duel-points-preview-concurrency.cjs
          DUEL_TEST_METRIC=training_count DUEL_TEST_REWARD=ranked_v21 node tests/duel-points-preview-concurrency.cjs
          node tests/duel-metric-rollback-guard.cjs
      - name: Archive period isolation, public visibility, pagination and read-only contract
        run: |
          createdb league21_replay_archive
          psql -X -d league21_replay_archive -v ON_ERROR_STOP=1 -f tests/period-archive-schema.sql
      - name: Explicit period close, rollback, two-staff concurrency and immutable snapshots
        run: |
          createdb league21_replay_period_close
          psql -X -d league21_replay_period_close -v ON_ERROR_STOP=1 -f tests/period-close-schema.sql
          psql -X -d league21_replay_period_close -v ON_ERROR_STOP=1 -f tests/period-close-rollback.sql
          psql -X -d league21_replay_period_close -v ON_ERROR_STOP=1 -f tests/period-notices-transaction.sql -f tests/period-notices-rollback.sql
          PGDATABASE=league21_replay_period_close node tests/period-close-concurrency.cjs
          PGDATABASE=league21_replay_period_close node tests/period-close-rollback-guard.cjs
      - name: Own training history, complete aggregates, legacy parity and read-only rollback
        env:
          PGDATABASE: league21_replay_studio_history
        run: |
          createdb league21_replay_studio_history
          psql -X -v ON_ERROR_STOP=1 -f tests/studio-history-schema.sql
          node tests/studio-history-parity.cjs
          psql -X -v ON_ERROR_STOP=1 -f tests/studio-history-rollback.sql
  league21-sql-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16','17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Construct isolated production-like V2 base
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          createdb -h localhost -U postgres league21_replay_ci
          psql -X -h localhost -U postgres -d league21_replay_ci -v ON_ERROR_STOP=1 \
            -f tests/league-21-productionlike-baseline.sql
      - name: Replay all V2.1 migrations in one rollback transaction
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -h localhost -U postgres -d league21_replay_ci -At -v ON_ERROR_STOP=1 \
            -f tests/league-21-migration-replay.sql | tee /tmp/league21-replay.txt
          grep -Eq '"release_21_postflight_passed"[[:space:]]*:[[:space:]]*true' /tmp/league21-replay.txt
      - name: Confirm transaction left original V2 data intact
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -h localhost -U postgres -d league21_replay_ci -At \
            -c "select case when to_regclass('public.league_seasons_v21') is null
              and (select count(*) from public.profiles)=3
              and (select count(*) from public.point_transactions)=0
              and (select count(*) from public.league_feature_flags)=2
              then 'RESTORED' else 'DIRTY-REPLAY' end" | grep -qx RESTORED
      - name: Verify generated transactional release bundle on separate disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          node tests/build-league-21-release.cjs --check
          node tests/build-league-21-release.cjs --output "$RUNNER_TEMP/league21-release.sql"
          createdb -h localhost -U postgres league21_replay_release_bundle
          # PostgreSQL roles are CLUSTER-scoped: they were created by the first fixture database.
          # Omit only the two already-existing role creation statements in the second DB.
          sed -e '/^create role anon nologin;$/d' -e '/^create role authenticated nologin;$/d' \
            tests/league-21-productionlike-baseline.sql > "$RUNNER_TEMP/league21-second-baseline.sql"
          psql -X -h localhost -U postgres -d league21_replay_release_bundle -v ON_ERROR_STOP=1 \
            -f "$RUNNER_TEMP/league21-second-baseline.sql" >/dev/null
          psql -X -h localhost -U postgres -d league21_replay_release_bundle -v ON_ERROR_STOP=1 \
            -f "$RUNNER_TEMP/league21-release.sql" >/dev/null
          psql -X -h localhost -U postgres -d league21_replay_release_bundle -At -v ON_ERROR_STOP=1 \
            -f supabase/production-prep/league_21_postflight_read_only.sql \
            | tee /tmp/league21-bundle-postflight.txt
          grep -Eq '"release_21_postflight_passed"[[:space:]]*:[[:space:]]*true' \
            /tmp/league21-bundle-postflight.txt
          echo 'PASS: generated atomic release package installs and passes postflight without PROD access.'
      - name: Install V2.1 in isolated DB for dump and restore rehearsal
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -h localhost -U postgres -d league21_replay_ci -At -v ON_ERROR_STOP=1 \
            -f tests/league-21-migration-apply-disposable.sql | tee /tmp/league21-installed.txt
          grep -Eq '"release_21_postflight_passed"[[:space:]]*:[[:space:]]*true' /tmp/league21-installed.txt
      - name: Verify V2.1 fixture semantics under real PostgreSQL roles
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for fixture in \
            tests/league-21-public-h2h-transaction.sql \
            tests/league-21-season-fair-close-transaction.sql \
            tests/league-21-global-settlement-transaction.sql \
            tests/league-21-goal-training-corrections-transaction.sql \
            tests/league-21-duel-missing-ledger-transaction.sql \
            tests/league-21-arena-missing-ledger-transaction.sql; do
            echo "Testing $fixture (transaction rollback)"
            psql -X -h localhost -U postgres -d league21_replay_ci \
              -v ON_ERROR_STOP=1 -f "$fixture" >/dev/null
          done
          echo 'PASS: All V2.1 transactional role and scoring fixtures'
      - name: Verify disposable V2.1 backup and restored schema
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          docker run --rm --network host -e PGPASSWORD=postgres -v "$RUNNER_TEMP:/backups" \
            postgres:${{ matrix.postgres }} pg_dump -h 127.0.0.1 -U postgres \
            -d league21_replay_ci -Fc --no-owner -f /backups/league21-staging.dump
          createdb -h localhost -U postgres league21_restore_probe
          docker run --rm --network host -e PGPASSWORD=postgres -v "$RUNNER_TEMP:/backups" \
            postgres:${{ matrix.postgres }} pg_restore -h 127.0.0.1 -U postgres \
            -d league21_restore_probe --no-owner --exit-on-error /backups/league21-staging.dump
          CHECK="select pg_catalog.jsonb_build_object(
            'profiles',(select count(*) from public.profiles),
            'points',(select count(*) from public.point_transactions),
            'v21tables',(select count(*) from pg_catalog.pg_class c
              join pg_catalog.pg_namespace n on n.oid=c.relnamespace
              where n.nspname='public' and c.relname like '%_v21' and c.relkind='r'),
            'flags',(select count(*) from public.league_feature_flags),
            'goals',(select count(*) from public.league_boxer_goals_v21),
            'duels',(select count(*) from public.league_duels))::text"
          BEFORE="$(psql -X -h localhost -U postgres -d league21_replay_ci -Atc "$CHECK")"
          AFTER="$(psql -X -h localhost -U postgres -d league21_restore_probe -Atc "$CHECK")"
          test "$BEFORE" = "$AFTER"
          psql -X -h localhost -U postgres -d league21_restore_probe -At -v ON_ERROR_STOP=1 \
            -f supabase/production-prep/league_21_postflight_read_only.sql \
            | tee /tmp/league21-restored-postflight.txt
          grep -Eq '"release_21_postflight_passed"[[:space:]]*:[[:space:]]*true' \
            /tmp/league21-restored-postflight.txt
          echo "PASS: V2.1 disposable PostgreSQL dump and restore. NOT a production backup."
