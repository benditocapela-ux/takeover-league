name: Premium V2 isolated pilot (no deploy)
on:
  pull_request:
    paths: ['tools/premium-v2/**', 'scripts/*premium-v2*', 'tests/premium-v2-*', 'docs/premium-v2/**', '.github/workflows/premium-v2-pilot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node tests/premium-v2-contracts.cjs
      - run: node tests/premium-v2-pilot-browser.cjs
        env:
          BROWSER: ${{ matrix.browser }}
          SHOTS: ${{ runner.temp }}/premium-v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-v2-${{ matrix.browser }}
          path: ${{ runner.temp }}/premium-v2/
