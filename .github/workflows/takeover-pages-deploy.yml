name: Publish Takeover League to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - '*.png'
      - '*.woff'
      - 'manifest.webmanifest'
      - 'avatars/**'
      - 'tools/build-news.cjs'
      - '.github/workflows/takeover-pages-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: takeover-pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble release-only static site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _site
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.svg' -o -name '*.png' -o -name '*.woff' -o -name '*.webmanifest' \) -exec cp '{}' _site/ \;
          # Broken CSS (e.g. a missing "}") must never be published.
          node tests/css-structure.cjs
          node tests/js-regex-guard.cjs
          # Self-hosted fonts referenced by takeover-theme.css must ship with the release.
          for font in takeover-inter takeover-barlow-condensed-700 takeover-barlow-condensed-800; do
            test -s "_site/${font}.woff"
          done
          cp -R avatars _site/avatars
          rm -f _site/challenges-v2-preview.html _site/duels-v2-preview.html _site/league2-preview.html
          touch _site/.nojekyll
          # Etappe 7b: Neuigkeiten aus den «## News»-Abschnitten gemergter PRs (Fehler hier stoppen das Deployment nicht).
          gh api "repos/${GITHUB_REPOSITORY}/pulls?state=closed&base=main&sort=updated&direction=desc&per_page=80" > /tmp/prs.json || echo '[]' > /tmp/prs.json
          node tools/build-news.cjs /tmp/prs.json _site/news.json
          test -s _site/news.json
          # Etappe 7b/7c: Neuigkeiten, Feedback, Hilfe und Tour werden mitgeliefert.
          for f in news.html feedback.html hilfe.html karten.html takeover-help.js mein-boxer.html takeover-holo.js; do test -s "_site/${f}"; done
          test -s _site/takeover-navigation.js
          test -s _site/takeover-navigation.css
          test -s _site/takeover-theme.css
          test -s _site/icons.svg
          test -s _site/boxer-profile.js
          test -s _site/boxer-profile.html
          # League 2.1 static entrypoints must be packaged in the public release.
          for page in arena goals league-manager league-challenges league-history boxer-compare admin; do
            test -s "_site/${page}.html"
          done
          # Guest showcase: the public, account-free view of the league.
          test -s _site/guest.html
          grep -Fq 'iqarjivcrddcixrvqbfb' _site/guest.html
          grep -Fq 'Als Gast ansehen' _site/login.html
          test -s _site/takeover-quick-actions.js
          for page in boxer coach challenges duels; do
            grep -Fq 'takeover-quick-actions.js' "_site/${page}.html"
          done
          # All production HTML entrypoints must ship the shared, re-openable menu.
          for page in index login boxer coach admin challenges duels awards features coming-soon boxer-profile; do
            grep -Fq 'takeover-navigation.js' "_site/${page}.html"
            grep -Fq 'takeover-navigation.css' "_site/${page}.html"
          done
          grep -Fq 'TAKEOVER_CHALLENGES_V2_ENABLED=true' _site/challenges.html
          grep -Fq 'TAKEOVER_DUELS_V2_ENABLED=true' _site/duels.html
          grep -Fq 'iqarjivcrddcixrvqbfb' _site/challenges.html
          grep -Fq 'iqarjivcrddcixrvqbfb' _site/duels.html
          # Cache busting: GitHub Pages lets browsers cache files for ~10 minutes.
          # Version every local stylesheet/script link with the commit so new HTML
          # never renders with an old cached CSS/JS file after a deploy.
          release="${GITHUB_SHA:0:8}"
          sed -i -E "s#((href|src)=\"\./[A-Za-z0-9._-]+\.(css|js))\"#\1?v=${release}\"#g" _site/*.html
          test "$(grep -c "takeover-redesign.css?v=${release}" _site/index.html)" -ge 1
          if grep -lE '(href|src)="\./[A-Za-z0-9._-]+\.(css|js)"' _site/*.html; then echo 'Unversioned local asset link left'; exit 1; fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify publicly served release
        run: |
          set -euo pipefail
          for n in 1 2 3 4 5 6; do
            if node tests/hosted-v2-live-release-check.cjs; then exit 0; fi
            echo "Still awaiting Pages publish (attempt $n/6)"
            sleep 15
          done
          exit 1
