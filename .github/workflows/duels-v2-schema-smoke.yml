name: Duel V2 isolated PostgreSQL schema smoke

on:
  push:
    branches:
      - develop/takeover-league-2-foundation
    paths:
      - 'supabase/tests/DUELS_V2_SCHEMA_SMOKE_FIXTURE.sql'
      - 'supabase/tests/DUELS_V2_PREFLIGHT_READ_ONLY.sql'
      - 'supabase/tests/DUELS_V2_SCHEMA_BEHAVIOR_SMOKE.sql'
      - 'supabase/migrations/007_duels_v2_schema_review.sql'
      - 'supabase/migrations/008_duels_v2_invitation_rpc_review.sql'
      - 'supabase/migrations/009_duels_v2_settlement_review.sql'
      - 'supabase/migrations/010_duels_v2_read_rpc_review.sql'
      - 'supabase/tests/DUELS_V2_READ_BEHAVIOR_SMOKE.sql'
      - 'supabase/tests/DUELS_V2_SETTLEMENT_BEHAVIOR_SMOKE.sql'
      - 'supabase/tests/DUELS_V2_INVITATION_BEHAVIOR_SMOKE.sql'
      - '.github/workflows/duels-v2-schema-smoke.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/tests/DUELS_V2_*'
      - 'supabase/migrations/00[7-9]_duels_v2_*'
      - 'supabase/migrations/010_duels_v2_read_rpc_review.sql'
      - '.github/workflows/duels-v2-schema-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: duel_test
          POSTGRES_PASSWORD: synthetic_only
          POSTGRES_DB: duel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U duel_test -d duel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: duel_test
      PGPASSWORD: synthetic_only
      PGDATABASE: duel_test
      PGOPTIONS: -csearch_path=public
    steps:
      - uses: actions/checkout@v4
      - name: Create synthetic base schema
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/DUELS_V2_SCHEMA_SMOKE_FIXTURE.sql
      - name: Execute read-only schema and training RPC preflight on synthetic database
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/DUELS_V2_PREFLIGHT_READ_ONLY.sql
      - name: Apply duel schema migration 007 in disposable database
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/007_duels_v2_schema_review.sql
      - name: Verify schema constraints, permissions and disabled flag
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $smoke$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM public.league_feature_flags
                           WHERE feature_key='duels' AND is_enabled=false) THEN
              RAISE EXCEPTION 'Duel feature flag is not disabled by default';
            END IF;
            IF to_regclass('public.league_duels') IS NULL
               OR to_regclass('public.league_duel_exp_ledger') IS NULL
               OR to_regclass('public.league_duel_events') IS NULL THEN
              RAISE EXCEPTION 'Required duel tables missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relname='league_duels'
                AND c.relrowsecurity
            ) THEN
              RAISE EXCEPTION 'Duel RLS is not enabled';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_indexes
              WHERE schemaname='public' AND indexname='league_duels_one_active_per_pair'
            ) THEN
              RAISE EXCEPTION 'Missing active-pair unique index';
            END IF;
          END $smoke$;
          SQL

      - name: Exercise actual PostgreSQL duel constraints
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/DUELS_V2_SCHEMA_BEHAVIOR_SMOKE.sql

      - name: Apply duel invitation RPC migration 008 in disposable database
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/008_duels_v2_invitation_rpc_review.sql
      - name: Exercise invitation and acceptance RPCs in PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/DUELS_V2_INVITATION_BEHAVIOR_SMOKE.sql

      - name: Apply duel settlement migration 009 in disposable database
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/009_duels_v2_settlement_review.sql
      - name: Exercise settlement and payout idempotency in PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/DUELS_V2_SETTLEMENT_BEHAVIOR_SMOKE.sql

      - name: Exercise due duel batch settlement in PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/DUELS_V2_BATCH_BEHAVIOR_SMOKE.sql

      - name: Apply duel read RPC migration 010 in disposable database
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/010_duels_v2_read_rpc_review.sql

      - name: Exercise duel read visibility in PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/DUELS_V2_READ_BEHAVIOR_SMOKE.sql

      - name: Exercise simultaneous duel settlement on isolated PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/DUELS_V2_CONCURRENT_SETTLEMENT_SETUP.sql
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE FUNCTION public.test_slow_duel_reward() RETURNS trigger
          LANGUAGE plpgsql AS $slow$
          BEGIN
            IF NEW.category='duel_exp' THEN PERFORM pg_sleep(1); END IF;
            RETURN NEW;
          END $slow$;
          CREATE TRIGGER test_slow_duel_reward BEFORE INSERT ON public.point_transactions
          FOR EACH ROW EXECUTE FUNCTION public.test_slow_duel_reward();
          SQL
          sql="SELECT set_config('test.auth_uid','10000000-0000-0000-0000-0000000000c3',false); SELECT public.duel_v2_reconcile('40000000-0000-0000-0000-000000000001');"
          psql -X -v ON_ERROR_STOP=1 -Atc "$sql" > /tmp/duel-race-1.log 2>&1 &
          first=$!
          psql -X -v ON_ERROR_STOP=1 -Atc "$sql" > /tmp/duel-race-2.log 2>&1 &
          second=$!
          wait "$first"
          wait "$second"
          grep -qx 'settled' /tmp/duel-race-1.log
          grep -qx 'settled' /tmp/duel-race-2.log
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $race$
          BEGIN
            IF (SELECT count(*) FROM public.point_transactions WHERE category='duel_exp')<>2
               OR (SELECT count(*) FROM public.league_duel_exp_ledger
                   WHERE duel_id='40000000-0000-0000-0000-000000000001')<>2
               OR (SELECT count(*) FROM public.league_duel_events
                   WHERE duel_id='40000000-0000-0000-0000-000000000001' AND event_type='settled')<>1
            THEN RAISE EXCEPTION 'Concurrent reconciliation created duplicate payout or event'; END IF;
          END $race$;
          SQL

