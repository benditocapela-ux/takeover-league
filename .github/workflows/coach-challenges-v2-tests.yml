name: Coach Challenges V2 contract tests
on:
  push:
    branches:
      - develop/takeover-league-2-foundation
    paths:
      - 'challenges.html'
      - 'supabase/migrations/0*_coach_challenges_v2_*.sql'
      - 'tests/test_coach_challenges_v2_*.py'
      - '.github/workflows/coach-challenges-v2-tests.yml'
  pull_request:
    paths:
      - 'challenges.html'
      - 'supabase/migrations/0*_coach_challenges_v2_*.sql'
      - 'tests/test_coach_challenges_v2_*.py'
      - '.github/workflows/coach-challenges-v2-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Run challenge UI and migration contracts
        run: python -m pytest -q tests/test_coach_challenges_v2_ui.py tests/test_coach_challenges_v2_migration_contract.py
