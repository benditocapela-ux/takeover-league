name: Takeover 3.0 · Boxer Experience, App-Shell und Konto-Umschalter
on:
  push:
    branches: ['feature/boxer-experience-redesign','feature/takeover-3-app-shell']
  pull_request:
    paths:
      - 'login.html'
      - 'takeover-navigation.js'
      - 'boxer.html'
      - 'tests/boxer-experience-routing.cjs'
      - 'boxer-experience.html'
      - 'boxer-experience.js'
      - 'takeover-app-shell.js'
      - 'takeover-app-shell.css'
      - 'takeover-account.js'
      - 'takeover-training-form.js'
      - 'boxer-experience-studio.js'
      - 'takeover-experience.css'
      - 'takeover-anime.js'
      - 'takeover-premium-character.js'
      - 'tools/publish-premium-character.cjs'
      - 'tests/anime-everywhere-browser.cjs'
      - 'tests/takeover3-contracts.cjs'
      - 'tests/takeover3-browser.cjs'
      - 'tests/takeover3-harness.cjs'
      - 'tests/boxer-experience-contract.cjs'
      - 'tests/boxer-experience-browser.cjs'
      - '.github/workflows/boxer-experience-contracts.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify role, tab, no direct database mutation and club request boundaries
        run: node --test tests/boxer-experience-contract.cjs
      - name: Takeover 3.0 contracts (App-Shell, Konto-Umschalter, Trainingsformular, Legacy-Weiterleitungen)
        run: node --test tests/takeover3-contracts.cjs
      - name: Check login, PWA start URL and role-safe navigation
        run: node --test tests/boxer-experience-routing.cjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Boxer Experience im Browser (Chromium + WebKit, gemocktes Supabase)
        run: SHOTS=boxer-experience-screenshots REQUIRE_WEBKIT=1 node tests/boxer-experience-browser.cjs
      - name: Anime-Darstellung überall (veröffentlichter Build, Chromium + WebKit)
        run: SHOTS=boxer-experience-screenshots/anime node tests/anime-everywhere-browser.cjs
      - name: Takeover 3.0 Benutzerwege (Konto, Training, Navigation; Chromium + WebKit; 320–1366 px)
        run: TAKEOVER3_SHOTS=boxer-experience-screenshots/takeover3 node tests/takeover3-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boxer-experience-screenshots
          path: boxer-experience-screenshots
          if-no-files-found: warn
